<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eigyo 2.5 — 営業リサーチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Design system: neutral grayscale + single accent, quiet borders, no
     gradients/shadows — modeled after Linear / Vercel / shadcn-ui tone. */
  :root{
    --bg:#fafafa; --panel:#ffffff; --panel-2:#f4f4f5; --border:#e4e4e7;
    --text:#18181b; --muted:#71717a;
    --ok:#15803d; --ok-bg:#f0fdf4; --warn:#a16207; --warn-bg:#fefce8;
    --bad:#b91c1c; --bad-bg:#fef2f2;
    --radius:6px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0a0a0b; --panel:#111113; --panel-2:#19191c; --border:#27272a;
      --text:#f4f4f5; --muted:#8b8b93;
      --ok:#4ade80; --ok-bg:#0f2417; --warn:#facc15; --warn-bg:#2a2308;
      --bad:#f87171; --bad-bg:#2a1414;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  a{color:var(--text)}

  header.top{padding:20px 20px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
  header.top h1{font-size:14px;margin:0;font-weight:600;letter-spacing:-.005em}
  header.top .ver{font-family:"JetBrains Mono",monospace;font-weight:500;color:var(--muted);font-size:11px;
    border:1px solid var(--border);border-radius:4px;padding:1px 6px;margin-left:8px;letter-spacing:0}
  header.top p{margin:6px 0 0;font-size:12px;color:var(--muted)}

  .wrap{padding:28px clamp(16px,4vw,40px) 56px}
  .list-head{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;max-width:1100px;margin-left:auto;margin-right:auto}
  .list-head h2{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
  .list-head .kv{font-size:12px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:1100px;margin:0 auto}
  .card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:var(--panel)}
  .card .name{font-weight:600;font-size:13.5px;margin-bottom:3px}
  .card .meta{font-size:11px;color:var(--muted);margin-bottom:8px}
  .card .summary{font-size:12.5px;margin-bottom:10px;line-height:1.55}
  .card .issue{font-size:12px;border-top:1px solid var(--border);padding-top:8px;line-height:1.55}
  .card .issue b{font-weight:600}
  .badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;margin:0 6px 6px 0}
  .b-none{background:var(--bad-bg);color:var(--bad)}
  .b-social{background:var(--warn-bg);color:var(--warn)}
  .b-ok{background:var(--ok-bg);color:var(--ok)}
  .b-type{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:13px}

  .card .block{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;line-height:1.7}
  .card .block b{font-weight:600}
  .card .block .txt{white-space:pre-wrap;margin:3px 0 0}
</style>
</head>
<body>

<header class="top">
  <h1>営業リサーチ<span class="ver">2.5</span></h1>
  <p>Indeed・Googleマップなどのネット上の公開情報をクロールし、自社サイトが弱い岡山市内の事業者をリストアップ。課題・提案・文面・台本はあらかじめ用意した内容をそのまま表示しています（AIをその場で呼び出すことはありません）。</p>
</header>

<div class="wrap">
  <div class="list-head">
    <h2>リストアップ結果</h2>
    <span class="kv" id="updated"></span>
  </div>
  <div class="grid" id="grid"><div class="empty">読み込み中…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://mqkuoygyatyalkynhauj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HONnw8Vn6XJAL94OaySFhw_RFmawq1Y";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATUS_BADGE = {
  none:['b-none','サイトなし'], social_only:['b-social','SNS/ポータルのみ'],
  outdated:['b-social','古い/低品質'], ok:['b-ok','サイトあり'],
};
const CORP_RE = /(株式会社|有限会社|合同会社|合資会社|㈱|㈲)/;
function bizType(name){ return CORP_RE.test(name||"") ? "企業" : "店舗"; }
function formatDate(iso){
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function indeedUrl(name, area){
  return "https://jp.indeed.com/jobs?q=" + encodeURIComponent(name||"") + "&l=" + encodeURIComponent(area||"岡山県");
}

async function load(){
  const { data, error } = await sb
    .from("prospects")
    .select("name, category, area, summary, hypothesis, website_status, website_note, contact, sources, created_at")
    .order("created_at", { ascending:false })
    .limit(30);
  const grid = document.getElementById("grid");
  if(error || !Array.isArray(data) || !data.length){
    grid.innerHTML = `<div class="empty">まだデータがありません。</div>`;
    return;
  }
  const seen = new Set();
  const list = data.filter(p=>{
    if(seen.has(p.name)) return false;
    seen.add(p.name); return true;
  }).slice(0, 20);
  document.getElementById("updated").textContent = "更新: " + formatDate(list[0].created_at) + "（" + list.length + "件）";
  grid.innerHTML = list.map((p,i)=>{
    const [cls,txt] = STATUS_BADGE[p.website_status] || STATUS_BADGE.none;
    const type = bizType(p.name);
    const src = Array.isArray(p.sources) && p.sources[0];
    const c = p.contact || {};
    return `<div class="card" data-i="${i}">
      <div>
        <span class="badge b-type">${type}</span>
        <span class="badge ${cls}">${txt}</span>
      </div>
      <div class="name">${esc(p.name||"")}</div>
      <div class="meta">${esc(p.category||"")}${p.area?" ・ "+esc(p.area):""}</div>
      ${p.summary?`<div class="summary">${esc(p.summary)}</div>`:""}
      ${p.hypothesis?`<div class="issue"><b>課題:</b> ${esc(p.hypothesis)}</div>`:""}
      ${c.proposal?`<div class="block"><b>提案:</b><div class="txt">${esc(c.proposal)}</div></div>`:""}
      ${c.pitch?`<div class="block"><b>文面:</b><div class="txt">${esc(c.pitch)}</div></div>`:""}
      ${c.script?`<div class="block"><b>台本:</b><div class="txt">${esc(c.script)}</div></div>`:""}
      <div class="meta" style="display:flex;gap:10px;margin-top:8px">
        ${src?`<a href="${esc(src)}" target="_blank" rel="noopener">情報源を見る →</a>`:""}
        <a href="${indeedUrl(p.name,p.area)}" target="_blank" rel="noopener">Indeedで求人を見る →</a>
      </div>
    </div>`;
  }).join("");
}
load();
</script>
</body>
</html>
