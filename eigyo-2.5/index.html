<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eigyo 2.5 — 営業リサーチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Design system: neutral grayscale + single accent, quiet borders, no
     gradients/shadows — modeled after Linear / Vercel / shadcn-ui tone. */
  :root{
    --bg:#fafafa; --panel:#ffffff; --panel-2:#f4f4f5; --border:#e4e4e7;
    --text:#18181b; --muted:#71717a;
    --ok:#15803d; --ok-bg:#f0fdf4; --warn:#a16207; --warn-bg:#fefce8;
    --bad:#b91c1c; --bad-bg:#fef2f2;
    --radius:6px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0a0a0b; --panel:#111113; --panel-2:#19191c; --border:#27272a;
      --text:#f4f4f5; --muted:#8b8b93;
      --ok:#4ade80; --ok-bg:#0f2417; --warn:#facc15; --warn-bg:#2a2308;
      --bad:#f87171; --bad-bg:#2a1414;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  a{color:var(--text)}

  header.top{padding:20px 20px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
  header.top h1{font-size:14px;margin:0;font-weight:600;letter-spacing:-.005em}
  header.top .ver{font-family:"JetBrains Mono",monospace;font-weight:500;color:var(--muted);font-size:11px;
    border:1px solid var(--border);border-radius:4px;padding:1px 6px;margin-left:8px;letter-spacing:0}
  header.top p{margin:6px 0 0;font-size:12px;color:var(--muted)}

  .wrap{padding:28px clamp(16px,4vw,40px) 56px}
  .list-head{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;max-width:1100px;margin-left:auto;margin-right:auto}
  .list-head h2{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
  .list-head .kv{font-size:12px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:1100px;margin:0 auto}
  .card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:var(--panel)}
  .card .name{font-weight:600;font-size:13.5px;margin-bottom:3px}
  .card .meta{font-size:11px;color:var(--muted);margin-bottom:8px}
  .card .summary{font-size:12.5px;margin-bottom:10px;line-height:1.55}
  .card .issue{font-size:12px;border-top:1px solid var(--border);padding-top:8px;line-height:1.55}
  .card .issue b{font-weight:600}
  .badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;margin:0 6px 6px 0}
  .b-none{background:var(--bad-bg);color:var(--bad)}
  .b-social{background:var(--warn-bg);color:var(--warn)}
  .b-ok{background:var(--ok-bg);color:var(--ok)}
  .b-type{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:13px}
  .hidden{display:none!important}

  .card .block{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;line-height:1.7}
  .card .block b{font-weight:600}
  .card .block .txt{white-space:pre-wrap;margin:3px 0 0}
  .card .block .more{display:block;background:none;border:none;padding:0;margin-top:2px;font-size:11px;color:var(--muted);
    cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:2px;text-align:right;width:100%}
  .card .block .more:hover{color:var(--text)}
  .card .dist{font-size:11px;color:var(--muted);margin-top:6px}

  .card .ch-list{margin:6px 0 0;list-style:none;padding:0}
  .card .ch-list li{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px}
  .card .ch-list .r{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
    border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0}
  .card .ch-list .r-good{background:var(--ok-bg);color:var(--ok)}
  .card .ch-list .r-mid{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
  .card .ch-list .r-weak{background:var(--warn-bg);color:var(--warn)}
  .card .ch-list .r-none{background:var(--bad-bg);color:var(--bad)}
  .card .ch-list .n{flex:1}
  .card .ch-list a.n{color:var(--text);text-decoration:underline;text-underline-offset:2px}

  .toolbar{max-width:1100px;margin:0 auto 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
  .toolbar .grp{display:flex;align-items:center;gap:6px}
  .toolbar label{font-size:11.5px;color:var(--muted)}
  .toolbar .seg{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .toolbar .seg button{font-family:inherit;font-size:12px;cursor:pointer;border:none;border-right:1px solid var(--border);
    background:var(--panel);color:var(--muted);padding:6px 11px}
  .toolbar .seg button:last-child{border-right:none}
  .toolbar .seg button.active{background:var(--text);color:var(--bg);font-weight:600}
  .toolbar select{font-family:inherit;font-size:12px;color:var(--text);background:var(--panel);
    border:1px solid var(--border);border-radius:var(--radius);padding:6px 9px}
  .toolbar .locbtn{font-family:inherit;font-size:12px;cursor:pointer;border-radius:var(--radius);border:1px solid var(--border);
    background:var(--panel);color:var(--text);padding:6px 11px}
  .toolbar .locbtn:hover{border-color:var(--text)}
  .toolbar .locbtn.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
</style>
</head>
<body>

<header class="top">
  <h1>営業リサーチ<span class="ver">2.5</span></h1>
  <p>Indeed・Googleマップなどのネット上の公開情報をクロールし、自社サイトが弱い岡山市内の事業者をリストアップ。課題・提案・文面・台本はあらかじめ用意した内容をそのまま表示しています（AIをその場で呼び出すことはありません）。</p>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="grp">
      <label>種別</label>
      <div class="seg" id="typeSeg">
        <button data-v="all" class="active">すべて</button>
        <button data-v="企業">企業</button>
        <button data-v="店舗">店舗</button>
      </div>
    </div>
    <div class="grp">
      <label>サイト状態</label>
      <div class="seg" id="statusSeg">
        <button data-v="all" class="active">すべて</button>
        <button data-v="none">サイトなし</button>
        <button data-v="social_only">SNS/ポータルのみ</button>
        <button data-v="outdated">古い/低品質</button>
      </div>
    </div>
    <div class="grp">
      <label>並び替え</label>
      <select id="sortSel">
        <option value="new">新着順</option>
        <option value="kana">五十音順</option>
        <option value="dist">現在地から近い順</option>
      </select>
    </div>
    <div class="grp">
      <button class="locbtn" id="locBtn">現在地を使う</button>
    </div>
  </div>
  <div class="list-head">
    <h2>リストアップ結果</h2>
    <span class="kv" id="updated"></span>
  </div>
  <div class="grid" id="grid"><div class="empty">読み込み中…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://mqkuoygyatyalkynhauj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HONnw8Vn6XJAL94OaySFhw_RFmawq1Y";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATUS_BADGE = {
  none:['b-none','サイトなし'], social_only:['b-social','SNS/ポータルのみ'],
  outdated:['b-social','古い/低品質'], ok:['b-ok','サイトあり'],
};
const CORP_RE = /(株式会社|有限会社|合同会社|合資会社|㈱|㈲)/;
function bizType(name){ return CORP_RE.test(name||"") ? "企業" : "店舗"; }
function formatDate(iso){
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function indeedUrl(name, area){
  return "https://jp.indeed.com/jobs?q=" + encodeURIComponent(name||"") + "&l=" + encodeURIComponent(area||"岡山県");
}
const TRUNC_LEN = 50;
function truncBlock(label, text){
  text = text||"";
  if(text.length <= TRUNC_LEN){
    return `<div class="block"><b>${label}:</b><div class="txt">${esc(text)}</div></div>`;
  }
  const shortTxt = text.slice(0, TRUNC_LEN) + "…";
  return `<div class="block">
    <b>${label}:</b>
    <div class="txt txt-short">${esc(shortTxt)}</div>
    <div class="txt txt-full hidden">${esc(text)}</div>
    <button class="more" data-more>続きを見る</button>
  </div>`;
}
const RATING_CLASS = { "◎":"r-good", "○":"r-mid", "△":"r-weak", "✕":"r-none" };
function channelsBlock(name, area, channels){
  if(!Array.isArray(channels) || !channels.length) return "";
  const items = channels.map(ch=>{
    const url = ch.u==="__INDEED__" ? indeedUrl(name, area) : ch.u;
    const label = url ? `<a class="n" href="${esc(url)}" target="_blank" rel="noopener">${esc(ch.n)}</a>` : `<span class="n">${esc(ch.n)}</span>`;
    const cls = RATING_CLASS[ch.r] || "r-mid";
    return `<li><span class="r ${cls}">${esc(ch.r)}</span>${label}</li>`;
  }).join("");
  return `<div class="block">
    <b>現状:</b>
    <ul class="ch-list hidden" data-ch-list>${items}</ul>
    <button class="more" data-more data-more-labels="現状を見る,閉じる">現状を見る</button>
  </div>`;
}
function haversineKm(lat1,lng1,lat2,lng2){
  const R = 6371, toRad = d=>d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

let allItems = [];
let state = { type:"all", status:"all", sort:"new", myPos:null };

function applyAndRender(){
  let list = allItems.filter(p=>{
    if(state.type!=="all" && bizType(p.name)!==state.type) return false;
    if(state.status!=="all" && p.website_status!==state.status) return false;
    return true;
  });
  if(state.sort==="kana"){
    list = list.slice().sort((a,b)=> (a.name||"").localeCompare(b.name||"","ja"));
  }else if(state.sort==="dist" && state.myPos){
    list = list.slice().map(p=>{
      const c = p.contact||{};
      const d = (typeof c.lat==="number" && typeof c.lng==="number")
        ? haversineKm(state.myPos.lat, state.myPos.lng, c.lat, c.lng) : Infinity;
      return Object.assign({}, p, { _dist:d });
    }).sort((a,b)=> a._dist - b._dist);
  } // "new" は取得順（created_at desc）のまま

  const grid = document.getElementById("grid");
  if(!list.length){
    grid.innerHTML = `<div class="empty">条件に合うデータがありません。</div>`;
    document.getElementById("updated").textContent = "";
    return;
  }
  document.getElementById("updated").textContent =
    "更新: " + formatDate(allItems[0].created_at) + "（" + list.length + "/" + allItems.length + "件）";
  grid.innerHTML = list.map((p)=>{
    const [cls,txt] = STATUS_BADGE[p.website_status] || STATUS_BADGE.none;
    const type = bizType(p.name);
    const c = p.contact || {};
    const distTxt = (typeof p._dist==="number" && isFinite(p._dist)) ? `現在地から約${p._dist.toFixed(1)}km` : "";
    return `<div class="card">
      <div>
        <span class="badge b-type">${type}</span>
        <span class="badge ${cls}">${txt}</span>
      </div>
      <div class="name">${esc(p.name||"")}</div>
      <div class="meta">${esc(p.category||"")}${p.area?" ・ "+esc(p.area):""}</div>
      ${p.summary?`<div class="summary">${esc(p.summary)}</div>`:""}
      ${p.hypothesis?`<div class="issue"><b>課題:</b> ${esc(p.hypothesis)}</div>`:""}
      ${channelsBlock(p.name, p.area, c.channels)}
      ${c.proposal?truncBlock("提案", c.proposal):""}
      ${c.pitch?truncBlock("文面", c.pitch):""}
      ${c.script?truncBlock("台本", c.script):""}
      ${distTxt?`<div class="dist">${distTxt}</div>`:""}
    </div>`;
  }).join("");
}

document.getElementById("grid").addEventListener("click", e=>{
  const btn = e.target.closest("[data-more]");
  if(!btn) return;
  const block = btn.closest(".block");
  const chList = block.querySelector("[data-ch-list]");
  if(chList){
    const [labelClosed, labelOpen] = (btn.dataset.moreLabels||"現状を見る,閉じる").split(",");
    const nowOpening = chList.classList.contains("hidden");
    chList.classList.toggle("hidden", !nowOpening);
    btn.textContent = nowOpening ? labelOpen : labelClosed;
    return;
  }
  const short = block.querySelector(".txt-short");
  const full = block.querySelector(".txt-full");
  const nowOpening = full.classList.contains("hidden");
  short.classList.toggle("hidden", nowOpening);
  full.classList.toggle("hidden", !nowOpening);
  btn.textContent = nowOpening ? "閉じる" : "続きを見る";
});

function wireToolbar(){
  document.querySelectorAll("#typeSeg button").forEach(b=>{
    b.onclick = ()=>{
      state.type = b.dataset.v;
      document.querySelectorAll("#typeSeg button").forEach(x=>x.classList.toggle("active", x===b));
      applyAndRender();
    };
  });
  document.querySelectorAll("#statusSeg button").forEach(b=>{
    b.onclick = ()=>{
      state.status = b.dataset.v;
      document.querySelectorAll("#statusSeg button").forEach(x=>x.classList.toggle("active", x===b));
      applyAndRender();
    };
  });
  document.getElementById("sortSel").onchange = (e)=>{
    state.sort = e.target.value;
    if(state.sort==="dist" && !state.myPos){ requestLocation(); }
    else applyAndRender();
  };
  document.getElementById("locBtn").onclick = requestLocation;
}
function requestLocation(){
  const btn = document.getElementById("locBtn");
  if(!navigator.geolocation){ alert("この端末では現在地が取得できません。"); return; }
  btn.textContent = "取得中…";
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      state.myPos = { lat:pos.coords.latitude, lng:pos.coords.longitude };
      btn.textContent = "現在地を使用中"; btn.classList.add("on");
      document.getElementById("sortSel").value = "dist";
      state.sort = "dist";
      applyAndRender();
    },
    ()=>{
      btn.textContent = "現在地を使う";
      alert("現在地を取得できませんでした。位置情報の利用を許可してください。");
    },
    { timeout:8000 }
  );
}

async function load(){
  const { data, error } = await sb
    .from("prospects")
    .select("name, category, area, summary, hypothesis, website_status, website_note, contact, sources, created_at")
    .order("created_at", { ascending:false })
    .limit(30);
  const grid = document.getElementById("grid");
  if(error || !Array.isArray(data) || !data.length){
    grid.innerHTML = `<div class="empty">まだデータがありません。</div>`;
    return;
  }
  const seen = new Set();
  allItems = data.filter(p=>{
    if(seen.has(p.name)) return false;
    seen.add(p.name); return true;
  }).slice(0, 20);
  wireToolbar();
  applyAndRender();
}
load();
</script>
</body>
</html>
