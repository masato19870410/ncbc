<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>わたしのTodoリスト</title>
<meta name="description" content="やることを追加し、未着手・着手中・完了を切り替えて削除できる自分用タスク管理アプリ。">

<style>
  :root {
    /* NoCodeBootCamp 完成見本のパレットに合わせて採色 */
    --primary: #538bb0;
    --primary-hover: #3d6f94;
    --primary-light: #eaf2f7;
    --bg: #f8fafc;
    --text: #1e293b;
    --sub: #64748b;
    --border: #e2e8f0;

    --card-bg: #ffffff;
    --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.05);
    --field-bg: #ffffff;
    --focus-ring: rgba(83, 139, 176, 0.18);

    --todo-bg: #f1f5f9;  --todo-fg: #64748b;
    --doing-bg: #fef3c7; --doing-fg: #b45309;
    --done-bg: #dcfce7;  --done-fg: #15803d;

    --del: #cbd5e1;
    --del-hover-fg: #ef4444;
    --del-hover-bg: #fef2f2;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #6ba6c9;
      --primary-hover: #7fb6d6;
      --primary-light: #1e2d37;
      --bg: #0e1621;
      --text: #e6ebf1;
      --sub: #93a2b5;
      --border: #24303f;

      --card-bg: #161f2b;
      --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      --field-bg: #0e1621;
      --focus-ring: rgba(107, 166, 201, 0.28);

      --todo-bg: #24303f;  --todo-fg: #93a2b5;
      --doing-bg: #3a2f14; --doing-fg: #e0a44a;
      --done-bg: #16311f;  --done-fg: #63c98a;

      --del: #4a5a6e;
      --del-hover-fg: #f87171;
      --del-hover-bg: #2a1a1a;
    }
  }

  :root[data-theme="dark"] {
    --primary: #6ba6c9;
    --primary-hover: #7fb6d6;
    --primary-light: #1e2d37;
    --bg: #0e1621;
    --text: #e6ebf1;
    --sub: #93a2b5;
    --border: #24303f;

    --card-bg: #161f2b;
    --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    --field-bg: #0e1621;
    --focus-ring: rgba(107, 166, 201, 0.28);

    --todo-bg: #24303f;  --todo-fg: #93a2b5;
    --doing-bg: #3a2f14; --doing-fg: #e0a44a;
    --done-bg: #16311f;  --done-fg: #63c98a;

    --del: #4a5a6e;
    --del-hover-fg: #f87171;
    --del-hover-bg: #2a1a1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 1.5rem; font-weight: 700; }
  header p { color: var(--sub); font-size: 0.85rem; margin-top: 4px; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--card-shadow);
  }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .input-row input {
    flex: 1;
    min-width: 0;
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.95rem;
    background: var(--field-bg);
    color: var(--text);
    outline: none;
  }
  .input-row input::placeholder { color: var(--sub); }
  .input-row input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }

  .btn {
    font: inherit;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    background: var(--primary);
    color: #fff;
    padding: 10px 18px;
    font-size: 0.95rem;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 16px 0; }
  .filters button {
    font: inherit;
    border: none;
    background: var(--bg);
    color: var(--sub);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
  }
  .filters button.active { background: var(--primary); color: #fff; }
  .filters button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  ul { list-style: none; padding: 8px 16px 16px; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 8px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }

  .state-btn {
    border: none;
    cursor: pointer;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.72rem;
    font-weight: 700;
    white-space: nowrap;
    min-width: 64px;
    transition: transform 0.12s;
  }
  .state-btn:active { transform: scale(0.94); }
  .state-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .s-todo  { background: var(--todo-bg);  color: var(--todo-fg); }
  .s-doing { background: var(--doing-bg); color: var(--doing-fg); }
  .s-done  { background: var(--done-bg);  color: var(--done-fg); }

  .title { flex: 1; min-width: 0; font-size: 0.95rem; word-break: break-word; }
  .title.done { text-decoration: line-through; color: var(--sub); }

  .del {
    border: none;
    background: transparent;
    color: var(--del);
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 8px;
    transition: color 0.15s, background 0.15s;
  }
  .del:hover { color: var(--del-hover-fg); background: var(--del-hover-bg); }
  .del:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

  .empty { text-align: center; color: var(--sub); font-size: 0.85rem; padding: 32px 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>わたしのTodoリスト</h1>
    <p>追加 → 状態を切り替え（未着手 / 着手中 / 完了）→ 削除ができます</p>
  </header>

  <div class="card">
    <form class="input-row" id="add-form" autocomplete="off">
      <input id="inp" type="text" placeholder="やることを入力（例: 資料をまとめる）" aria-label="やること" maxlength="60">
      <button class="btn" type="submit">追加</button>
    </form>

    <div class="filters" id="filters" role="group" aria-label="表示の絞り込み">
      <button type="button" data-f="all" class="active" aria-pressed="true">すべて</button>
      <button type="button" data-f="todo" aria-pressed="false">未着手</button>
      <button type="button" data-f="doing" aria-pressed="false">着手中</button>
      <button type="button" data-f="done" aria-pressed="false">完了</button>
    </div>

    <ul id="list"></ul>
    <p class="empty" id="empty" hidden>該当するタスクはありません</p>
  </div>
</div>

<script>
  (function () {
    "use strict";

    var STATES = ["todo", "doing", "done"];
    var LABEL = { todo: "未着手", doing: "着手中", done: "完了" };
    var KEY = "watashi-no-todo:v1";

    var inp = document.getElementById("inp");
    var listEl = document.getElementById("list");
    var emptyEl = document.getElementById("empty");
    var filterEls = Array.prototype.slice.call(document.querySelectorAll("#filters button"));

    var items = load();
    var filter = "all";

    function seed() {
      return [
        { id: 1, title: "イベントの完成見本を触ってみる", state: "done" },
        { id: 2, title: "作りたいものを選ぶ", state: "doing" },
        { id: 3, title: "AIに指示を書いてみる", state: "todo" }
      ];
    }

    function load() {
      try {
        var data = JSON.parse(localStorage.getItem(KEY));
        if (!Array.isArray(data)) return seed();
        return data.filter(function (it) {
          return it && typeof it.title === "string" && STATES.indexOf(it.state) > -1;
        });
      } catch (e) {
        return seed();
      }
    }

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
    }

    function add(text) {
      items.unshift({ id: Date.now(), title: text, state: "todo" });
      save();
      render();
    }

    function cycle(id) {
      var it = items.find(function (i) { return i.id === id; });
      if (!it) return;
      it.state = STATES[(STATES.indexOf(it.state) + 1) % STATES.length];
      save();
      render();
    }

    function del(id) {
      items = items.filter(function (i) { return i.id !== id; });
      save();
      render();
    }

    function render() {
      filterEls.forEach(function (b) {
        var on = b.dataset.f === filter;
        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", String(on));
      });

      var shown = items.filter(function (i) {
        return filter === "all" || i.state === filter;
      });

      listEl.innerHTML = "";
      shown.forEach(function (it) {
        var li = document.createElement("li");

        var st = document.createElement("button");
        st.type = "button";
        st.className = "state-btn s-" + it.state;
        st.textContent = LABEL[it.state];
        st.setAttribute("aria-label", "状態: " + LABEL[it.state] + "（押すと切り替え）");
        st.addEventListener("click", function () { cycle(it.id); });

        var title = document.createElement("span");
        title.className = "title" + (it.state === "done" ? " done" : "");
        title.textContent = it.title;

        var x = document.createElement("button");
        x.type = "button";
        x.className = "del";
        x.textContent = "×";
        x.setAttribute("aria-label", "「" + it.title + "」を削除");
        x.addEventListener("click", function () { del(it.id); });

        li.appendChild(st);
        li.appendChild(title);
        li.appendChild(x);
        listEl.appendChild(li);
      });

      emptyEl.hidden = shown.length !== 0;
    }

    document.getElementById("add-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = inp.value.trim();
      if (!v) return;
      add(v);
      inp.value = "";
      inp.focus();
    });

    document.getElementById("filters").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-f]");
      if (!b) return;
      filter = b.dataset.f;
      render();
    });

    render();
  })();
</script>

</body>
</html>
