<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>営業AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Design system: strict monochrome grayscale, quiet borders, no
     gradients/shadows — modeled after Linear / Vercel / shadcn-ui tone. */
  :root{
    --bg:#fafafa; --panel:#ffffff; --panel-2:#f4f4f5; --border:#e4e4e7;
    --text:#18181b; --muted:#71717a;
    --ok:#27272a; --ok-bg:#f4f4f5; --warn:#52525b; --warn-bg:#f4f4f5;
    --bad:#71717a; --bad-bg:#fafafa;
    --radius:6px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0a0a0b; --panel:#111113; --panel-2:#19191c; --border:#27272a;
      --text:#f4f4f5; --muted:#8b8b93;
      --ok:#e4e4e7; --ok-bg:#202023; --warn:#a1a1aa; --warn-bg:#19191c;
      --bad:#71717a; --bad-bg:#111113;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  a{color:var(--text)}

  header.top{border-bottom:1px solid var(--border);background:var(--panel)}
  header.top .inner{max-width:480px;margin:0 auto;padding:14px 16px 12px;text-align:center}
  header.top h1{font-size:14px;margin:0;font-weight:600;letter-spacing:-.005em;text-align:center;line-height:1.35}

  .desktop-shell{max-width:1040px;margin:0 auto}
  .wrap{padding:16px 16px 48px;max-width:480px;margin:0 auto}
  .desktop-rail{display:none}
  @media (min-width:960px){
    .desktop-shell{display:grid;grid-template-columns:220px 480px 220px;gap:24px;align-items:start;justify-content:center;padding:0 24px}
    .desktop-rail{display:block;position:sticky;top:24px;margin-top:16px}
    .rail-panel{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:14px}
    .rail-panel+.rail-panel{margin-top:10px}
    .rail-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:10px}
    .rail-stat{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--border);font-size:11.5px}
    .rail-stat:first-of-type{border-top:0;padding-top:0}
    .rail-stat strong{font-size:13px}
    .rail-priority{font-size:12px;font-weight:700;line-height:1.5}
    .rail-note{margin-top:4px;font-size:10.5px;color:var(--muted);line-height:1.55}
    .rail-steps{margin:0;padding-left:18px;color:var(--muted);font-size:11px;line-height:1.7}
    .rail-steps b{color:var(--text)}
    .wrap{padding-left:0;padding-right:0;width:480px}
  }
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:stretch}
  .disclaimer{margin:0 0 12px;border-left:2px solid var(--muted);padding:6px 8px;background:var(--panel-2);font-size:10px;line-height:1.55;color:var(--muted)}
  header.top .disclaimer{margin:4px 0 0;border:0;padding:0;background:transparent;font-size:9.5px;line-height:1.45}
  .card{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--panel);cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 10px rgba(0,0,0,.04);min-width:0;height:100%}
  .card:active{background:var(--panel-2)}
  .card[aria-current="true"]{border-color:var(--text)}
  .card .row-head{display:flex;align-items:baseline;gap:6px;min-width:0;margin-bottom:4px}
  .card .name{font-weight:700;font-size:13.5px;letter-spacing:-.01em;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta{display:block;font-size:11px;color:var(--muted);line-height:1.6;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .connection{margin:9px 0 7px;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--panel-2)}
  .card .connection-label{display:block;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
  .card .connection-label.next{margin-top:7px}
  .card .connection-route{display:block;font-size:11.5px;font-weight:700;line-height:1.45}
  .card .connection-step{display:block;margin-top:4px;font-size:10px;color:var(--muted);line-height:1.5}
  .card .compact-line{display:block;margin-top:7px;font-size:10.5px;line-height:1.6;overflow-wrap:anywhere}
  .card .line-group{margin-top:8px;padding:7px 8px;border:1px solid var(--border);border-radius:10px;background:var(--panel-2)}
  .card .line-group .compact-line{margin-top:4px}
  .card .line-group .compact-line:first-child{margin-top:0}
  .card .pitch{font-size:12px;margin-top:8px;margin-bottom:10px;line-height:1.55;min-height:55.8px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .card-cost{font-size:11.5px;margin-top:8px;margin-bottom:0;line-height:1.5;display:grid;gap:5px}
  .card .stage-label{display:block;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:3px}
  .card .proposal-stage{padding-top:7px;border-top:1px solid var(--border)}
  .card .cost-tag{display:block;font-size:10px;font-weight:700;color:var(--ok);background:var(--ok-bg);
    border-radius:4px;padding:2px 6px;width:100%;margin-bottom:5px;overflow-wrap:anywhere}
  .card .card-budget{display:block;overflow-wrap:anywhere;font-size:10px;color:var(--muted);margin-bottom:2px}
  .evidence-badge{display:inline-block;width:fit-content;border:1px solid var(--border);border-radius:999px;padding:1px 5px;font-size:9px;color:var(--muted);line-height:1.4}
  .card .card-investment,.card .card-product{display:block;overflow-wrap:anywhere}
  .card .card-investment{font-weight:600}
  .card .card-product{color:var(--muted)}
  @media (max-width:390px){
    .wrap{padding:12px 12px 40px}
    .grid{gap:8px}
    .card{padding:12px}
    .card .card-cost{font-size:11px}
    .card .cost-tag{font-size:9.5px;line-height:1.45}
    .card .card-budget{font-size:9.5px}
  }
  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:13px;grid-column:1/-1}
  .hidden{display:none!important}

  .card-detail{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;line-height:1.7}
  .card-detail .txt{white-space:pre-wrap;margin:8px 0 0;color:var(--muted)}
  .issue-row{margin-top:10px}
  .issue-row:first-child{margin-top:0}
  .dept-value{display:block;font-size:10.5px;font-weight:700;color:var(--text);
    background:var(--panel-2);border-radius:4px;padding:1px 6px;width:fit-content;margin-bottom:4px}
  .issue-row>span:last-child{display:block;font-size:12.5px;color:var(--text);line-height:1.6}
  .ch-group{margin-top:10px}
  .ch-group:first-child{margin-top:0}
  .ch-group b{display:block;font-size:10.5px;font-weight:700;color:var(--text);
    background:var(--panel-2);border-radius:4px;padding:1px 6px;width:fit-content;margin-bottom:6px}
  .meta a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}

  .ch-list{margin:6px 0 0;list-style:none;padding:0}
  .ch-list li{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px}
  .ch-list .r{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
    border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0}
  .ch-list .r-good{background:var(--ok-bg);color:var(--ok)}
  .ch-list .r-mid{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
  .ch-list .r-weak{background:var(--warn-bg);color:var(--warn)}
  .ch-list .r-none{background:var(--bad-bg);color:var(--bad)}
  .ch-list .n{flex:1}
  .ch-list a.n{color:var(--text);text-decoration:underline;text-underline-offset:2px}
  .ch-list .n-nolink{color:var(--muted)}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .overlay.hidden{display:none}
  .modal{background:var(--panel);width:100%;max-width:480px;max-height:94vh;overflow-y:auto;
    border-radius:16px 16px 0 0;padding:20px 18px 28px;position:relative}
  @media (min-width:520px){ .overlay{align-items:center} .modal{border-radius:14px;max-height:92vh;min-height:70vh} }
  .modal .close{position:sticky;float:right;top:12px;right:14px;margin-left:-40px;margin-top:-4px;
    border:none;background:var(--panel);border-radius:50%;font-size:20px;z-index:1;
    color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .modal .m-name{font-weight:700;font-size:16px;margin:0 28px 4px 0}
  .modal .m-meta{font-size:12px;color:var(--muted);margin-bottom:2px}
  .modal .m-meta a{color:var(--muted)}
  .approach-note{background:var(--panel-2);border-radius:8px;padding:10px 12px;font-size:12.5px;
    color:var(--text);line-height:1.6;margin-top:4px}

  .conclusion-box{background:var(--panel-2);border:2px solid var(--text);border-radius:10px;
    padding:14px 16px;margin-bottom:16px}
  .proposal-kicker{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.05em;margin-bottom:4px}
  .proposal-headline{font-size:16px;font-weight:800;line-height:1.45;color:var(--text);margin-bottom:10px}
  .proposal-headline strong{color:var(--ok)}
  .calc-alert{border:1px solid var(--warn);background:var(--warn-bg);border-radius:7px;padding:8px 9px;margin:0 0 10px;font-size:11.5px;line-height:1.55}
  .calc-alert b{display:block;font-size:10px;margin-bottom:2px;color:var(--warn)}
  .calc-alert.is-calculated{border-color:var(--ok);background:var(--ok-bg)}
  .calc-alert.is-calculated b{color:var(--ok)}
  .calc-account{display:block;margin-top:4px;color:var(--muted)}
  .proposal-flow{display:flex;align-items:stretch;gap:5px;margin:0 0 12px}
  .roi-bar{width:100%;max-width:320px;height:auto;margin:0 0 12px;display:block}
  .roi-bar-label{font-size:9px;fill:var(--muted);font-family:inherit}
  .roi-bar-effect{fill:var(--ok)}
  .roi-bar-price{fill:var(--muted)}
  .roi-bar-mini{width:100%;max-width:120px;height:auto;display:block;margin-top:4px}
  .rail-breakdown-bar{display:flex;width:100%;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;background:var(--panel-2)}
  .rail-breakdown-seg{height:100%}
  .seg-actual{background:var(--ok)}
  .seg-estimate{background:var(--muted)}
  .seg-unpriced{background:var(--border)}
  .rail-breakdown-legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:9.5px;color:var(--muted);align-items:center}
  .legend-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}
  .ranking-chart{display:flex;flex-direction:column;gap:7px}
  .ranking-row{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:6px}
  .ranking-name{font-size:9.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ranking-bar-track{display:block;height:7px;border-radius:4px;background:var(--panel-2)}
  .ranking-bar-fill{display:block;height:100%;border-radius:4px;background:var(--text)}
  .ranking-bar-unpriced{background:var(--border)}
  .ranking-value{font-size:9.5px;color:var(--muted);text-align:right}
  .hero-group{border-radius:10px;background:var(--panel-2);border-color:var(--border)}
  .hero-label{display:block;font-size:9px;color:var(--muted);letter-spacing:.03em}
  .hero-number{font-size:16px!important;font-weight:800!important;letter-spacing:-.01em;margin-top:1px!important;color:var(--text)}
  .proposal-step{flex:1;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:8px 7px;font-size:11px;font-weight:600;line-height:1.45;text-align:center}
  .proposal-arrow{align-self:center;color:var(--muted);font-weight:700}
  .client-benefit-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:3px}
  .client-benefit-text{font-size:13px;font-weight:600;line-height:1.65;color:var(--text);margin-bottom:4px}
  .benefit-source{margin-bottom:12px;font-size:11px}
  .benefit-source a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
  .conclusion-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .conclusion-cost{font-size:13px;font-weight:700;margin:2px 0 2px;color:var(--text)}
  .conclusion-dept{font-size:11px;font-weight:500;color:var(--muted);margin-bottom:8px}
  .conclusion-budget{font-size:11px;color:var(--warn);font-weight:600;margin-bottom:8px}

  .num-row{display:flex;gap:8px;margin-bottom:12px}
  .num-tile{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:8px 6px;text-align:center}
  .num-label{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:2px}
  .num-value{font-size:22px;font-weight:800;color:var(--ok);line-height:1.1}
  .num-value-sm{font-size:16px}
  .num-unit{font-size:11px;font-weight:600;margin-left:1px}
  .sim-box{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .sim-row{font-size:12px;line-height:1.6;margin-top:6px}
  .sim-row:first-child{margin-top:0}
  .sim-label{display:block;font-size:10.5px;font-weight:700;margin-bottom:2px}
  .sim-win .sim-label{color:var(--ok)}
  .sim-lose .sim-label{color:var(--bad)}
  .wrap-up{margin-top:10px;padding-top:10px;border-top:2px solid var(--text);font-size:13px;font-weight:700}
  .conclusion-reason{font-size:12.5px;color:var(--text);line-height:1.6}

  .ai-strategy{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:20px;background:var(--panel)}
  .ai-strategy .ai-kicker{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.05em;margin-bottom:3px}
  .ai-strategy h2{font-size:15px;line-height:1.45;margin:0 0 8px}
  .ai-status{display:inline-block;padding:2px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:10.5px;font-weight:700;margin-bottom:8px}
  .ai-row{margin-top:10px;font-size:12px;line-height:1.65}
  .ai-row b{display:block;font-size:10.5px;color:var(--muted);margin-bottom:2px}
  .ai-row ul{margin:3px 0 0;padding-left:18px}
  .ai-row li{margin:2px 0}
  .ai-confirmed{color:var(--ok)}
  .ai-estimate{color:var(--warn)}
  .ai-unknown{color:var(--bad)}
  .detail-toggle{margin:0;border:0;border-top:1px solid var(--border);border-radius:0;padding:10px 0;background:transparent}
  .detail-toggle summary{cursor:pointer;font-size:11px;color:var(--muted);font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;list-style-position:inside}
  .detail-toggle[open] summary{margin-bottom:10px;color:var(--text)}
  .detail-toggle:last-child{border-bottom:1px solid var(--border)}
  .trust-box,.priority-box{margin:10px 0;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--panel-2);font-size:11px;line-height:1.65}
  .trust-box b,.priority-box b{display:block;margin-bottom:3px;font-size:10px;color:var(--muted)}
  .rail-selected{font-size:11px;line-height:1.55}
  .rail-selected-name{font-size:13px;font-weight:700;margin-bottom:8px}
  .rail-selected-row{margin-top:8px}
  .rail-selected-row b{display:block;font-size:9.5px;color:var(--muted);margin-bottom:2px}
  .rail-detail-btn{width:100%;margin-top:12px;border:1px solid var(--border);border-radius:7px;background:var(--text);color:var(--bg);font:inherit;font-size:11px;font-weight:700;padding:8px;cursor:pointer}
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <h1>営業AI</h1>
    <p class="disclaimer">金額は公開情報に基づく参考試算です。成果を保証するものではありません。</p>
  </div>
</header>

<div class="desktop-shell">
  <aside class="desktop-rail" aria-label="営業サマリー">
    <div class="rail-panel">
      <div class="rail-title">営業サマリー</div>
      <div class="rail-stat"><span>掲載企業</span><strong id="rail-total">—</strong></div>
      <div class="rail-stat"><span>金額試算あり</span><strong id="rail-calculated">—</strong></div>
      <div class="rail-stat"><span>業種推定</span><strong id="rail-estimated">—</strong></div>
      <div id="rail-breakdown"></div>
    </div>
    <div class="rail-panel">
      <div class="rail-title">最優先候補</div>
      <div class="rail-priority" id="rail-priority">読み込み中…</div>
      <div class="rail-note">費用対効果・会社規模・提案しやすさから自動選定</div>
    </div>
    <div class="rail-panel">
      <div class="rail-title">優先度TOP3</div>
      <ol class="rail-steps" id="rail-top3" style="list-style:decimal;padding-left:18px;margin:0">読み込み中…</ol>
    </div>
    <div class="rail-panel">
      <div class="rail-title">全社比較(年間効果額)</div>
      <div id="rail-ranking"></div>
    </div>
  </aside>

  <main class="wrap">
    <div class="grid" id="grid"><div class="empty">読み込み中…</div></div>
  </main>

  <aside class="desktop-rail" aria-label="選択した会社の要点">
    <div class="rail-panel">
      <div class="rail-title">選択した会社</div>
      <div class="rail-selected" id="rail-selected">カードを選択すると要点を表示します。</div>
    </div>
    <div class="rail-panel">
      <div class="rail-title">表示順</div>
      <div class="rail-note">費用対効果 → 会社規模 → 制作費の順で優先しています。接点の有無は順位に使いません。</div>
    </div>
  </aside>
</div>

<div class="overlay hidden" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
if(location.protocol === "file:"){
  location.replace("https://masato19870410.github.io/ncbc/eigyo5.5/?from=local");
}
/* =======================================================================
   v4: データ取得元を Googleスプレッドシートの「ウェブに公開」CSVに変更。
   UI/CSS/チェックリスト表示ロジックは eigyo3.5 ベース + アプローチの切り口を追加。

   ★ユーザー作業が必要★
   下の SHEET_CSV_URL に、Googleスプレッドシート側で
   「ファイル→共有→ウェブに公開」した後に発行されるCSVエクスポートURLを
   設定すること。手順は README.md を参照。
   ======================================================================= */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1OmKyrwSlLxOEPetl5Q17Aox05Ata8FHMxhDEYgtDkX4/export?format=csv&gid=1331008365";

const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clipText = (s, max) => {
  const text = (s??"").toString().replace(/\s+/g, " ").trim();
  return text.length <= max ? text : `${text.slice(0, max - 1)}…`;
};
const googleMapsSearchUrl = address => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address || "")}`;

const RATING_CLASS = { "◎":"r-good", "○":"r-mid", "△":"r-weak", "✕":"r-none" };
function channelLi(ch){
  const cls = RATING_CLASS[ch.r] || "r-mid";
  const note = ch.m ? ` title="${esc(ch.m)}"` : "";
  const label = ch.u
    ? `<a class="n" href="${esc(ch.u)}" target="_blank" rel="noopener"${note}>${esc(ch.n)}</a>`
    : `<span class="n n-nolink"${note}>${esc(ch.n)}</span>`;
  return `<li><span class="r ${cls}">${esc(ch.r)}</span>${label}</li>`;
}
const CH_ORDER = ["自社サイト", "採用サイト", "Instagram", "X", "Facebook", "LINE公式", "YouTube", "note", "TikTok", "Googleマップ", "Yahoo!マップ", "ホットペッパービューティー", "Indeed"];
function sortChannels(channels){
  const rank = n => { const i = CH_ORDER.indexOf(n); return i === -1 ? CH_ORDER.length : i; };
  return channels
    .map((ch, i) => ({ ch, i }))
    .sort((a, b) => rank(a.ch.n) - rank(b.ch.n) || a.i - b.i)
    .map(x => x.ch);

function roiBarSvg(conclusion){
  if(!conclusion.proposalReady) return "";
  const nums = s => (String(s||"").match(/\d+(?:,\d{3})*(?:\.\d+)?/g) || []).map(n=>parseFloat(n.replace(/,/g,"")));
  const effectNums = nums(conclusion.effectValue);
  const priceNums = nums(conclusion.priceLabel);
  if(!effectNums.length || !priceNums.length) return "";
  const effectHigh = Math.max(...effectNums);
  const priceHigh = Math.max(...priceNums);
  const maxVal = Math.max(effectHigh, priceHigh) || 1;
  const barW = v => Math.max(4, Math.round((v / maxVal) * 220));
  const effectLabel = `${conclusion.effectAccountName}${conclusion.effectType === "費用減" ? "リスク" : "増"} ${conclusion.effectValue}/年`;
  const priceLabelText = conclusion.priceLabel.replace(/[（(]単発[）)]/g, "");
  return `<svg class="roi-bar" viewBox="0 0 320 58" role="img" aria-label="費用対効果の比較グラフ">
    <text x="0" y="12" class="roi-bar-label">${esc(effectLabel)}</text>
    <rect x="0" y="16" width="${barW(effectHigh)}" height="14" rx="4" class="roi-bar-effect"></rect>
    <text x="0" y="42" class="roi-bar-label">${esc(priceLabelText)}</text>
    <rect x="0" y="46" width="${barW(priceHigh)}" height="10" rx="4" class="roi-bar-price"></rect>
  </svg>`;
}
function roiBarCompactSvg(conclusion){
  if(!conclusion.proposalReady) return "";
  const nums = s => (String(s||"").match(/\d+(?:,\d{3})*(?:\.\d+)?/g) || []).map(n=>parseFloat(n.replace(/,/g,"")));
  const effectHigh = Math.max(...nums(conclusion.effectValue), 0);
  const priceHigh = Math.max(...nums(conclusion.priceLabel), 0);
  if(!effectHigh || !priceHigh) return "";
  const maxVal = Math.max(effectHigh, priceHigh) || 1;
  const barW = v => Math.max(3, Math.round((v / maxVal) * 100));
  return `<svg class="roi-bar-mini" viewBox="0 0 100 15" role="img" aria-label="効果と価格の比較">
    <rect x="0" y="0" width="${barW(effectHigh)}" height="6" rx="2" class="roi-bar-effect"></rect>
    <rect x="0" y="9" width="${barW(priceHigh)}" height="5" rx="2" class="roi-bar-price"></rect>

function researchMeta(p){
  const facts = RESEARCH_FACTS[p.name] || {};
  const factSources = Array.isArray(facts.additionalSources) ? facts.additionalSources : [];
  const channelSources = (p.contact?.channels || []).filter(ch=>ch.u).map(ch=>({ label:ch.n, url:ch.u, note:ch.m || "" }));
  const sources = [...factSources, ...channelSources].filter((s,i,all)=>s.url && all.findIndex(x=>x.url===s.url)===i);
  const dates = sources.flatMap(s=>String(s.note || "").match(/20\d{2}-\d{2}-\d{2}/g) || []).sort();
  const checkedAt = dates.length ? dates[dates.length - 1] : "確認日未登録";
  const statuses = [facts.employeeStatus, facts.capitalStatus, facts.revenueStatus].filter(Boolean);
  const trust = statuses.some(s=>String(s).startsWith("確定")) ? "確認済み情報あり"
    : statuses.some(s=>String(s).startsWith("推定")) ? "外部情報からの推定" : "未確認項目あり";
  return { facts, sources, checkedAt, trust };
}
function priorityReason(p, conclusion = concludeDept(p)){
  if(conclusion.effectValue === "未算定") return "効果根拠が不足しているため追加調査が必要";
  const channels = p.contact?.channels || [];
  const facts = RESEARCH_FACTS[p.name] || {};
  const reasons = [];
  if(conclusion.effectValue !== "未算定") reasons.push(conclusion.isEstimate ? "業界平均で参考試算可能" : "求人データで参考試算可能");
  if(findChannel(channels, "Indeed")) reasons.push("求人課題あり");
  if(facts.employeeCount || facts.capitalMan || facts.revenueRangeText) reasons.push("会社規模情報あり");
  if(!reasons.length) reasons.push("公開情報から提案根拠を確認できる候補");
  return reasons.join("・");
}

  const channels = Array.isArray(p.contact?.channels) ? p.contact.channels : [];
  const site = findChannel(channels, "自社サイト");
  const recruitSite = findChannel(channels, "採用サイト");
  const gmap = findChannel(channels, "Googleマップ");

  if(indeed && (indeed.r === "◎" || indeed.r === "○") &&
      (recruitSite || !site || site.r === "✕" || /未掲載/.test(site.m || ""))){

/* ---- 求人票に給与記載が無い場合、業種が近い職種の全国平均年収(公的統計)で代用する ----
   実在の企業データが取れない場合のみ使うフォールバック。該当が無ければnullを返し、
   未算定のまま表示する(存在しない業種を無理に当てはめて捏造しない)。 */
function industryWageBenchmark(industry){
  const table = [
    { match: /機械器具の修理|機械.*設置|機械修理|機械整備/,
      label: "物流設備管理・保全（岡山県）", lowMan: 550, highMan: 680,
      source: "厚生労働省 job tag 職業情報（物流設備管理・保全、岡山県平均年収614.8万円、令和7年賃金構造基本統計調査）",
      sourceUrl: "https://shigoto.mhlw.go.jp/User/Occupation/Detail/269" },
  ];
  const hit = table.find(t => industry && t.match.test(industry));
  return hit || null;
}

/* ---- 営業/人事/広報のうちどれが最も費用対効果が高いかを結論づける ---- */
function concludeDept(p){
  const c = p.contact || {};
  const channels = Array.isArray(c.channels) ? c.channels : [];
  const site = findChannel(channels, "自社サイト");
  const recruitSite = findChannel(channels, "採用サイト");
  const gmap = findChannel(channels, "Googleマップ");
  const indeed = findChannel(channels, "Indeed");
  const facts = RESEARCH_FACTS[p.name] || {};

  // 資本金・売上高は事業規模の参考情報。制作予算そのものではないため、予算額の推定には使わない。
  // ステータス表記(確定/推定/未確認)は出典ごとに個社管理(RESEARCH_FACTS)し、ここでは汎用ラベルを付けない。
  const capitalMan = parseFloat(p.capitalMan || facts.capitalMan) || 0;
  const revenueMan = parseFloat(p.revenueMan || facts.revenueMan) || 0;
  const employeeScale = facts.employeeCount
    ? `従業員${facts.employeeCount}人（${facts.employeeStatus}）`
    : "従業員数は未確認";

  // カードの「会社規模」行は資本金・売上高・従業員数を参考値としてそのまま並べるだけで、
  // 予算そのものを試算・推定することはしない(資本金→予算の換算に使える実在の相場が無いため)。
  // 不明な項目は他カードと見た目を揃えるため「?」で埋める(資本金?万円・従業員?人)。
  const employeeShort = facts.employeeCount ? `従業員：${facts.employeeCount}人` : "従業員：？人";
  // カード上では「10億円以上〜50億円未満」を「10〜50億円」に縮め、1行に収める。
  const cardRevenueRange = facts.revenueRangeText
    ? facts.revenueRangeText.replace(/^(.+?)億円以上[〜～](.+?)億円未満$/, "$1〜$2億円")
    : "";
  const capitalPart = capitalMan > 0 ? `資本金：${capitalMan.toLocaleString("ja-JP")}万円` : "資本金：？万円";
  const revenuePart = cardRevenueRange ? `売上高：${cardRevenueRange}`
    : revenueMan >= 10000 ? `売上高：${(revenueMan/10000).toFixed(0)}億円`
    : "売上高：？円";
  const cardBudget = `${revenuePart} ${capitalPart} ${employeeShort}`;

  let businessScale, businessScaleNote;
  if(facts.revenueRangeText){
    businessScale = `年間売上高${facts.revenueRangeText}（${facts.revenueStatus}） / ${employeeScale}`;
    businessScaleNote = `年間売上高は${facts.revenueStatus}。${employeeScale}。今回の制作・運用予算は提案前に確認する。`;
  } else if(revenueMan >= 10000){
    businessScale = `年間売上高${(revenueMan/10000).toFixed(0)}億円（${facts.revenueStatus || "推定（根拠不明）"}） / ${employeeScale}`;
    businessScaleNote = `年間売上高は${facts.revenueStatus || "推定（根拠不明）"}。${employeeScale}。今回の制作・運用予算は提案前に確認する。`;
  } else if(capitalMan >= 800){
    businessScale = `資本金${capitalMan}万円（${facts.capitalStatus || "推定（根拠不明）"}） / ${employeeScale}`;
    businessScaleNote = `資本金は${facts.capitalStatus || "推定（根拠不明）"}。${employeeScale}。今回の制作・運用予算は提案前に確認する。`;
  } else if(capitalMan > 0){
    businessScale = `資本金${capitalMan}万円（${facts.capitalStatus || "推定（根拠不明）"}） / ${employeeScale}`;
    businessScaleNote = `資本金は${facts.capitalStatus || "推定（根拠不明）"}。${employeeScale}。今回の制作・運用予算は提案前に確認する。`;
  } else {
    businessScale = `売上高・資本金は未確認 / ${employeeScale}`;
    businessScaleNote = `売上高・資本金は未確認。${employeeScale}。今回の制作・運用予算は提案前に確認する。`;
  }

  // 分岐順で提案を決めず、候補ごとに公開情報上の必要性を比較する。
  const activeJob = !!(indeed && (indeed.r==="◎" || indeed.r==="○"));
  const proposalScores = {
    recruit: (activeJob ? 40 : 0) + ((!site || site.r==="✕") ? 15 : 0) + (/未掲載/.test(site?.m || "") ? 15 : 0) + (recruitSite ? 10 : 0),
    map: (!gmap || gmap.r==="✕") ? 20 : 0,
    site: (site?.r==="△") ? 25 : ((!site || site.r==="✕") ? 15 : 0),
    social: ["Instagram","X","Facebook","LINE公式"].filter(name=>{ const ch=findChannel(channels,name); return !ch || ch.r==="✕"; }).length * 3,
  };
  const proposalKind = Object.entries(proposalScores).sort((a,b)=>b[1]-a[1])[0][0];

  let result;
  if(proposalKind === "map"){
    result = {
      cost: "導入コスト: 無料・即日",
      action: "Googleビジネスプロフィールの登録",
      accountItem: "外注費（初期設定代行）",
      dept: "営業",
      text: p.hypothesisSales,
      priceLabel: "初期費用 2〜3万円（単発）",
      effectType: "売上増",
      effectValue: "未算定",
      effectNote: "算定には問い合わせ・成約データが必要",
      calculationFormula: "年額の増収効果 = 月間の追加問い合わせ数 × 成約率 × 1件あたりの粗利 × 12",
      calculationInputs: "月間問い合わせ数・成約率・平均粗利・Googleマップ経由の割合",
      clientBenefit: "検索経由の問い合わせを取りこぼしている可能性がある。ただしアクセス解析データが無く、具体的な金額は算出できない(誠実に「不明」とする)。",
      benefitStatus: "未算定（必要情報なし）",
      reason: `Googleビジネスプロフィール自体は無料。初期設定を代行する提案として、低い初期費用から始められる。${businessScaleNote}`,
      winCase: "Googleマップ経由の問い合わせ数を、登録前後で計測できる状態にする。",
      loseCase: "登録後に見る指標(表示回数・電話・ルート検索・問い合わせ)を先に合意する。",
    };
  } else if(proposalKind === "recruit"){
    // 相手側の効果(採用コスト削減)を、求人票記載の月給レンジ×人材紹介手数料相場(年収の30%が業界慣行)から試算。
    // 金額換算できるのはこの採用系だけ(営業/広報は流入→成約の実データが無く金額換算は困難)。
    // 自社サイトはあるが、Indeedで募集中の主力職種が自社サイトの採用ページに載っていない(「未掲載」)ケースは、
    // 「新設」ではなく「拡充」を商材にする。サイトの有無ではなく、採用ページが主力職種をカバーできているかで分岐する。
    const siteHasRecruitGap = !!(site && /未掲載/.test(site.m||""));
    const hasRecruitSite = !!recruitSite;
    let clientBenefit = "採用に関する具体的な損失額は、求人票に給与情報が無く算出できない。";
    let clientBenefitAmount = "";
    let benefitIsEstimate = false;
    let benefitSourceUrl = "";
    let benefitSourceLabel = "";
    let benefitFormula = "";
    const monthlyMatch = indeed.m && indeed.m.match(/月給(\d+(?:\.\d+)?)万?(?:[〜~](\d+(?:\.\d+)?)万?)?円/);
    const dailyMatch = !monthlyMatch && indeed.m && indeed.m.match(/日給(\d+(?:\.\d+)?)万?(?:[〜~](\d+(?:\.\d+)?)万?)?円/);
    const DAYS_PER_MONTH = 21.6; // ハローワーク求人票の「月平均労働日数」で使われる日給→月額換算の標準係数
    if(monthlyMatch || dailyMatch){
      const m = monthlyMatch || dailyMatch;
      let lo = parseFloat(m[1]);
      let hi = m[2] ? parseFloat(m[2]) : lo;
      const unitLabel = monthlyMatch ? "月給" : "日給";
      const basisNote = dailyMatch ? `(日給→月給換算: 稼働${DAYS_PER_MONTH}日/月と仮定)` : "";
      if(dailyMatch){ lo = lo * DAYS_PER_MONTH; hi = hi * DAYS_PER_MONTH; }
      const feeLo = Math.round(lo * 12 * 0.3);
      const feeHi = Math.round(hi * 12 * 0.3);
      clientBenefitAmount = `${feeLo}〜${feeHi}万円`;
      clientBenefit = `試算条件: 求人票の${unitLabel}(${m[0].replace("円","")}円)${basisNote}、人材紹介の成功報酬相場を年収の30%と置く。現状ハローワーク等の無料掲載だけで採用できているなら、今は発生していないコスト。ただし応募が集まらず人材紹介に頼らざるを得なくなった場合、1名あたり${feeLo}〜${feeHi}万円の費用がかかる。採用ページはその保険として機能する。`;
      if(indeed.u){ benefitSourceUrl = indeed.u; benefitSourceLabel = "求人票（Indeed）を見る"; }
      benefitFormula = dailyMatch
        ? `日給${m[1]}${m[2]?`〜${m[2]}`:""}万円 × 稼働${DAYS_PER_MONTH}日/月 = 月給換算${lo.toFixed(1)}〜${hi.toFixed(1)}万円 → × 12か月 × 人材紹介手数料率30% = ${feeLo}〜${feeHi}万円`
        : `月給${lo}${hi!==lo?`〜${hi}`:""}万円 × 12か月 × 人材紹介手数料率30% = ${feeLo}〜${feeHi}万円`;
    } else {
      // 求人票に給与記載がない場合、業種が近い職種の全国平均年収(厚生労働省 job tag)を根拠に推定する。
      // 個社の実データではなく全国平均であることを明記し、試算(個社データ)とは区別する。
      const benchmark = industryWageBenchmark(p.industry);
      if(benchmark){
        const feeLo = Math.round(benchmark.lowMan * 0.3);
        const feeHi = Math.round(benchmark.highMan * 0.3);
        clientBenefitAmount = `${feeLo}〜${feeHi}万円`;
        benefitIsEstimate = true;
        clientBenefit = `推定条件: 求人票に給与記載が無いため、業種が近い「${benchmark.label}」の平均年収(${benchmark.lowMan}〜${benchmark.highMan}万円、出典: ${benchmark.source})で代用。人材紹介の成功報酬相場を年収の30%と置く。現状ハローワーク等の無料掲載だけで採用できているなら、今は発生していないコスト。応募が集まらず人材紹介に頼らざるを得なくなった場合の備えとして提示する。実際の給与水準とは異なる可能性があるため、商談で要確認。`;
        if(benchmark.sourceUrl){ benefitSourceUrl = benchmark.sourceUrl; benefitSourceLabel = "出典（job tag）を見る"; }
        benefitFormula = `業種平均年収${benchmark.lowMan}〜${benchmark.highMan}万円 × 人材紹介手数料率30% = ${feeLo}〜${feeHi}万円`;
      }
    }
    result = {
      cost: "導入コスト: 低",
      action: hasRecruitSite ? "既存採用サイトの求人導線改善" : (siteHasRecruitGap ? "採用ページの職種拡充" : "採用特化ページの新設"),
      accountItem: (hasRecruitSite || siteHasRecruitGap) ? "外注費（改修費）" : "外注費（制作費）",
      dept: "人事",
      text: p.hypothesisHr,

  result.effectPeriod = "年額";

    : "効果の勘定科目：売上高。利益額ではなく売上増の効果であり、粗利・営業利益への影響は別途確認。";

  result.cardBudget = cardBudget;
  result.proposalReady = result.effectValue !== "未算定";
  result.topConclusion = !result.proposalReady
    ? "効果根拠が不足しているため提案は保留。公開情報を追加調査してから提案可否を判断する。"
    : `${effectLabel}の${result.effectType === "費用減" ? "回避可能性" : "増加目安"}を参考に、${result.action}への${result.priceLabel}の投資可否を判断する。`;
  result.wrapUp = result.proposalReady
    ? `結論: まずは${result.dept}課題(${result.action})を${result.priceLabel}で提案する。`
    : "結論: 現時点では提案しない。効果算定に必要な情報を追加調査する。";
  // 効果を先、投資内容を後に置いて、ラベルに頼らず読める順にする。
  const shortAction = result.action.replace(/[(（].*?[)）]/g,"");
  // カード一覧は横幅が狭いため「年額」を省略し、括弧を外して1行に収まりやすくする。
  // 「年額」は省くが、年ベースの数字であることは経営判断に必須の情報なので「/年」で必ず残す。
  result.cardLine = result.proposalReady ? referenceEffectLabel(p, result) : "提案保留｜効果根拠を追加調査";
  result.cardInvestment = result.proposalReady ? result.priceLabel : "費用提示なし";
  result.cardProduct = result.proposalReady ? shortAction : "追加調査が必要";

  return result;
}

function fitScore(p){
  // 費用対効果ファースト・予算セカンド: ROIが実額で見える会社を最優先し、
  // 同条件なら資本金(予算感)が大きい会社を上にする。接点・連絡経路の有無は順位に使わない。
  const c = p.contact || {};
  const channels = Array.isArray(c.channels) ? c.channels : [];
  const diag = diagnoseApproach(p);
  const indeed = findChannel(channels, "Indeed");
  const concl = concludeDept(p);

  let score = 0;
  // 最優先: 個社の実データに基づく「試算」 > 全国・都道府県平均を使った「業種推定」 > 「未算定」。
  // 各階層の間は金額差では絶対に逆転しないよう、階層ごとに大きな間隔(10000点)を空ける。
  // 階層内では効果額(上限)が大きい順に並ぶよう、階層の点数に金額をそのまま加算する(金額は数百までなので階層をまたがない)。
  if(concl.effectValue !== "未算定"){
    const nums = String(concl.effectValue).match(/\d+(?:\.\d+)?/g);
    const upper = nums && nums.length ? Math.max(...nums.map(Number)) : 0;
    score += (concl.isEstimate ? 10000 : 20000) + upper;
  }

  // 予算セカンド: 会社規模(資本金・売上高・従業員数)が分かる会社ほど加点(確定>推定、金額が大きいほど加点)。
  // 不明な会社は無理に下げないが、分かる会社がより上に来るようにする。
  const facts = RESEARCH_FACTS[p.name] || {};
  const capitalMan = parseFloat(p.capitalMan || facts.capitalMan) || 0;
  const revenueManForScore = parseFloat(p.revenueMan || facts.revenueMan) || 0;
  if(capitalMan > 0){
    score += Math.min(capitalMan / 100, 20); // 100万円ごとに1点、上限20点
    if(facts.capitalStatus && facts.capitalStatus.startsWith("確定")) score += 5;
  }
  if(revenueManForScore > 0 || facts.revenueRangeText) score += 8; // 売上規模が分かる会社を少し優先
  if(facts.employeeCount){
    score += 3; // 従業員数が分かる会社を少し優先
    if(facts.employeeStatus && facts.employeeStatus.startsWith("確定")) score += 2;
  }

  // 価格サード: 商材価格(priceLabel)が安いほど導入ハードルが低く提案しやすいので、わずかに加点する。
  // ROI・予算より優先度を下げるため最大5点に抑える(予算の最大加点25点を上回らない)。
  const priceNums = String(concl.priceLabel || "").match(/\d+(?:\.\d+)?/g);
  if(priceNums && priceNums.length){
    const priceLower = Math.min(...priceNums.map(Number));
    score += Math.max(5 - priceLower / 10, 0); // 安いほど加点、50万円以上で加点ゼロ
  }

  // 低コストで直せる(改善提案・応募導線)ほどROIが高い。ゼロから作る(認知構築)は工数が重い。
  if(diag.type === "改善提案型") score += 30;
  else if(diag.type === "応募導線型") score += 25;
  else if(diag.type === "信頼補強型") score += 15;
  else score += 5; // 認知構築型

  // 相手の採用予算感(求人の活発さ)をROIの代理指標にする
  if(indeed){
    if(indeed.r === "◎") score += 20;
    else if(indeed.r === "○") score += 10;
  }

  return score;
}

function companyCardLines(p, conclusion, connection){
  const effectLines = conclusion.proposalReady
    ? (conclusion.effectType === "費用減"
        ? [`人材紹介費：年${conclusion.effectValue}`]
        : [`${conclusion.effectAccountName}：年${conclusion.effectValue}`])
    : ["効果根拠不足のため金額提示保留"];
  const compactLabel = {
    "Googleビジネスプロフィールの登録": "GBP登録費",
    "既存採用サイトの求人導線改善": "採用導線改修費",
    "採用ページの職種拡充": "採用ページ改修費",
    "採用特化ページの新設": "採用ページ新設費",
    "既存サイトの情報・問い合わせ導線改善": "サイト改修費",
    "SNS等での情報発信の開始": "SNS運用費"
  };
  const amountOnly = conclusion.cardInvestment.replace(/[（(]単発[）)]/g, "").replace(/^\S+\s+/, "");
  const proposalLines = conclusion.proposalReady
    ? [`${compactLabel[conclusion.cardProduct] || conclusion.cardProduct}：${amountOnly}`]
    : ["不足する効果根拠を確認"];
  const uniqueApproachLines = {
    "株式会社フジショウ": "運送業の合同説明会",
    "有限会社杉元建具": "建具組合の公開行事",
    "有限会社三谷工業": "公開投稿で告知する行事",
    "株式会社シーエス建材トーヨー住器": "LIXIL公開相談会",
    "有限会社石井電業社": "電気工事系の合同説明会",
    "有限会社コバヤシ防災システム": "消防設備協会の公開講習",
    "有限会社ワイ・エス・ピー": "商工会議所の商談会・交流会",
    "竹森工芸株式会社": "商工会議所の公開行事",
    "日新機工有限会社": "機械設備の技術講習",
    "光陽警備保障株式会社": "警備業の合同説明会"
  };
  const approach = [uniqueApproachLines[p.name] || connection.route];
  const clean = s => s.replace(/[。、，・｜|（）()]/g, " ").replace(/\s+/g, " ").trim().slice(0, 20);
  return {
    effect: effectLines.map(clean).filter(Boolean),
    proposal: proposalLines.map(clean).filter(Boolean),
    scale: conclusion.cardBudget.split(" ").map(clean).filter(Boolean),
    approach: approach.map(clean).filter(Boolean)
  };
}

function cardHtml(p, idx){
  const concl = concludeDept(p);
  const connection = connectionPlan(p);
  const lines = companyCardLines(p, concl, connection);
  return `<div class="card" data-idx="${idx}">
      <div class="row-head">
        <div class="name" title="${esc(p.name||"")}">${esc(clipText(p.name, 15))}</div>
      </div>
      ${p.area ? `<div class="meta" title="${esc(p.area)}">${esc(p.area)}</div>` : ""}
      <div class="line-group hero-group">${lines.effect.map(l => {
        const [label, num] = l.includes("：") ? l.split(/：(.+)/) : [null, l];
        return label ? `<span class="hero-label">${esc(label)}</span><span class="compact-line hero-number">${esc(num)}</span>` : `<span class="compact-line hero-number">${esc(num)}</span>`;

}

  openIdx = idx;
}
function closeModal(){ overlay.classList.add("hidden"); openIdx = null; }

function renderSelectedCompany(idx){
  const p = ITEMS[idx];
  const target = document.getElementById("rail-selected");
  if(!p || !target) return;
  const conclusion = concludeDept(p);
  const connection = connectionPlan(p);
  selectedIdx = idx;
  target.innerHTML = `<div class="rail-selected-name">${esc(p.name)}</div>
    <div class="rail-selected-row"><b>相手に出せそうな効果</b>${esc(conclusion.cardLine)}</div>
    <div class="rail-selected-row"><b>予算に合いそうな提案</b>${esc(conclusion.cardBudget)} / ${esc(conclusion.cardProduct)} / ${esc(conclusion.cardInvestment)}</div>
    <div class="rail-selected-row"><b>接触方法</b>${esc(connection.route)}</div>
    <div class="rail-selected-row"><b>最初の一歩</b>${esc(connection.firstStep)}</div>
    <div class="rail-selected-row"><b>${conclusion.proposalReady ? "優先理由" : "保留理由"}</b>${esc(priorityReason(p, conclusion))}</div>
    <div class="rail-selected-row"><b>算定に必要な情報</b>${esc(conclusion.calculationInputs || "条件未登録")}</div>
    <button class="rail-detail-btn" type="button" data-open-selected>詳細を見る</button>`;
  document.querySelectorAll(".card").forEach(card=>card.setAttribute("aria-current", Number(card.dataset.idx) === idx ? "true" : "false"));
}

document.getElementById("grid").addEventListener("click", e=>{
  if(e.target.closest("a")) return;
  const card = e.target.closest(".card");
  if(!card) return;
  const idx = Number(card.dataset.idx);
  if(window.matchMedia("(min-width:960px)").matches){
    renderSelectedCompany(idx);
  }
  if(idx === openIdx && !overlay.classList.contains("hidden")){ closeModal(); return; }
  openModal(idx);
});
document.querySelector(".desktop-shell").addEventListener("click", e=>{
  if(e.target.closest("[data-open-selected]") && selectedIdx !== null) openModal(selectedIdx);
});
overlay.addEventListener("click", e=>{
  if(e.target === overlay || e.target.closest("[data-close]")) { closeModal(); return; }
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeModal(); });

/* ---- CSVパース（RFC4180相当。カンマ/改行/二重引用符を含むフィールドに対応） ---- */
function parseCsv(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += ch;
      }
    } else {
      if(ch === '"'){
        inQuotes = true;
      } else if(ch === ','){
        row.push(field); field = "";
      } else if(ch === '\n'){
        row.push(field); field = "";
        rows.push(row); row = [];
      } else if(ch === '\r'){
        // skip, \n (or end) will close the row
      } else {
        field += ch;
      }
    }
  }
  // 末尾に改行が無いファイルの最終フィールド/行を回収
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ""));
}

function rowsToItems(rows){
  if(!rows.length) return [];
  const header = rows[0];
  const idx = {};
  header.forEach((h,i)=> idx[h.trim()] = i);
  return rows.slice(1).filter(r=>r.length>1 || r[0]).map(r=>{
    let channels = [];
    try{ channels = JSON.parse(r[idx.channels_json] || "[]"); }catch(e){}
    return applyVerifiedOverrides({
      name: r[idx.name],
      category: r[idx.category],
      industry: r[idx.industry],
      area: r[idx.area],
      phone: r[idx.phone],
      email: r[idx.email],
      dept: r[idx.dept],
      hypothesisSales: r[idx.hypothesis_sales],
      hypothesisHr: r[idx.hypothesis_hr],
      hypothesisPr: r[idx.hypothesis_pr],
      capitalMan: r[idx.capital_man],
      revenueMan: r[idx.revenue_man],
      contact: {
        channels,
        proposal: r[idx.proposal],
        approachNote: r[idx.approach_note],
        message: r[idx.message],
        script: r[idx.script],
      },
    });
  }).filter(p=>p.name);
}

function renderGrid(){
  const grid = document.getElementById("grid");
  if(!ITEMS.length) return;
  const order = ITEMS.map((p,i)=>({p,i,conclusion:concludeDept(p)}))
    .sort((a,b)=>fitScore(b.p)-fitScore(a.p));
  grid.innerHTML = order.length ? order.map(({p,i})=>cardHtml(p,i)).join("") : `<div class="empty">条件に合う会社がありません。</div>`;
  if(selectedIdx !== null) renderSelectedCompany(selectedIdx);
}

function renderDesktopSummary(){
  const conclusions = ITEMS.map(p=>concludeDept(p));
  const calculated = conclusions.filter(c=>c.effectValue !== "未算定");
  const estimated = calculated.filter(c=>c.isEstimate);
  const ranked = ITEMS.map((p,i)=>({p,i})).sort((a,b)=>fitScore(b.p)-fitScore(a.p));
  const priorityEntry = ranked[0];
  const priority = priorityEntry?.p;
  document.getElementById("rail-total").textContent = `${ITEMS.length}社`;
  document.getElementById("rail-calculated").textContent = `${calculated.length}社`;
  document.getElementById("rail-estimated").textContent = `${estimated.length}社`;
  const actual = calculated.length - estimated.length;
  const unpriced = ITEMS.length - calculated.length;
  const seg = (n,cls) => ITEMS.length ? `<div class="rail-breakdown-seg ${cls}" style="width:${(n/ITEMS.length*100).toFixed(1)}%"></div>` : "";
  document.getElementById("rail-breakdown").innerHTML = ITEMS.length
    ? `<div class="rail-breakdown-bar">${seg(actual,"seg-actual")}${seg(estimated.length,"seg-estimate")}${seg(unpriced,"seg-unpriced")}</div>
       <div class="rail-breakdown-legend"><span class="legend-dot seg-actual"></span>試算 ${actual}<span class="legend-dot seg-estimate"></span>推定 ${estimated.length}<span class="legend-dot seg-unpriced"></span>未算定 ${unpriced}</div>`
    : "";
  document.getElementById("rail-priority").innerHTML = priority
    ? `<b>${esc(priority.name)}</b><div class="rail-note">${esc(priorityReason(priority))}</div>` : "—";
  document.getElementById("rail-top3").innerHTML = ranked.slice(0,3).map(({p})=>{
    const c = concludeDept(p);
    return `<li style="margin-bottom:8px"><b>${esc(clipText(p.name,13))}</b><br><span class="rail-note" style="margin-top:2px">${esc(c.effectValue !== "未算定" ? `${c.effectAccountName} ${c.effectValue}/年` : "効果未算定")}</span></li>`;
  }).join("");
  const nums = s => (String(s||"").match(/\d+(?:,\d{3})*(?:\.\d+)?/g) || []).map(n=>parseFloat(n.replace(/,/g,"")));
  const ranking = ranked.map(({p,i})=>{
    const c = concludeDept(p);
    const high = Math.max(...nums(c.effectValue), 0);
    return {name:p.name, high, unpriced: c.effectValue === "未算定"};
  });
  const maxEffect = Math.max(...ranking.map(r=>r.high), 1);
  document.getElementById("rail-ranking").innerHTML = `<div class="ranking-chart">${ranking.map(r=>`
    <div class="ranking-row">
      <span class="ranking-name">${esc(clipText(r.name,9))}</span>
      <span class="ranking-bar-track"><span class="ranking-bar-fill${r.unpriced?" ranking-bar-unpriced":""}" style="width:${r.unpriced?6:Math.max(4,Math.round(r.high/maxEffect*100))}%"></span></span>
      <span class="ranking-value">${r.unpriced?"—":Math.round(r.high)+"万"}</span>
    </div>`).join("")}</div>`;
  if(priorityEntry) renderSelectedCompany(priorityEntry.i);
}

async function load(){
  const grid = document.getElementById("grid");
  try{
    if(!SHEET_CSV_URL || SHEET_CSV_URL.indexOf("__SET_SHEET_CSV_URL_HERE__") !== -1){
      throw new Error("SHEET_CSV_URL未設定");
    }
    const res = await fetch(SHEET_CSV_URL);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = parseCsv(text);
    const items = rowsToItems(rows);
    if(!items.length) throw new Error("no rows");
    ITEMS = items;
    renderGrid();
    renderDesktopSummary();
  }catch(err){
    console.error(err);
    grid.innerHTML = `<div class="empty">データを読み込めませんでした。(${esc(err.message)})<br>SHEET_CSV_URLの設定、またはシートの「ウェブに公開」設定を確認してください。README.mdを参照。</div>`;
  }
}
load();
</script>
