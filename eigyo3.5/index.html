<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>営業アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Design system: neutral grayscale + single accent, quiet borders, no
     gradients/shadows — modeled after Linear / Vercel / shadcn-ui tone. */
  :root{
    --bg:#fafafa; --panel:#ffffff; --panel-2:#f4f4f5; --border:#e4e4e7;
    --text:#18181b; --muted:#71717a;
    --ok:#15803d; --ok-bg:#f0fdf4; --warn:#a16207; --warn-bg:#fefce8;
    --bad:#b91c1c; --bad-bg:#fef2f2;
    --radius:6px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0a0a0b; --panel:#111113; --panel-2:#19191c; --border:#27272a;
      --text:#f4f4f5; --muted:#8b8b93;
      --ok:#4ade80; --ok-bg:#0f2417; --warn:#facc15; --warn-bg:#2a2308;
      --bad:#f87171; --bad-bg:#2a1414;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  a{color:var(--text)}

  header.top{border-bottom:1px solid var(--border);background:var(--panel)}
  header.top .inner{max-width:480px;margin:0 auto;padding:16px 16px 12px}
  header.top h1{font-size:14px;margin:0;font-weight:600;letter-spacing:-.005em}
  header.top .count{font-size:11.5px;font-weight:500;color:var(--muted)}

  /* PC/モバイルとも常にスマホ幅の2列・中央寄せ・縦長に固定する */
  .wrap{padding:16px 16px 48px;max-width:480px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:start}
  .card{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--panel);cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 10px rgba(0,0,0,.04);min-width:0}
  .card:active{background:var(--panel-2)}
  .card .row-head{display:flex;align-items:baseline;gap:6px;min-width:0;margin-bottom:4px}
  .card .num{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);flex-shrink:0}
  .card .name{font-weight:700;font-size:13.5px;letter-spacing:-.01em;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta{font-size:11px;color:var(--muted);line-height:1.6;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .pitch{font-size:12px;margin-top:8px;margin-bottom:10px;line-height:1.55;min-height:55.8px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:13px;grid-column:1/-1}
  .hidden{display:none!important}

  .card-detail{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;line-height:1.7}
  .card-detail .txt{white-space:pre-wrap;margin:8px 0 0;color:var(--muted)}
  .detail-section{margin-bottom:20px}
  .detail-section:last-child{margin-bottom:0}
  .detail-section>b{display:block;font-size:11px;color:var(--muted);font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
  .issue-row{margin-top:10px}
  .issue-row:first-child{margin-top:0}
  .dept-value{display:block;font-size:10.5px;font-weight:700;color:var(--text);
    background:var(--panel-2);border-radius:4px;padding:1px 6px;width:fit-content;margin-bottom:4px}
  .issue-row>span:last-child{display:block;font-size:12.5px;color:var(--text);line-height:1.6}
  .ch-group{margin-top:10px}
  .ch-group:first-child{margin-top:0}
  .ch-group b{display:block;font-size:10.5px;font-weight:700;color:var(--text);
    background:var(--panel-2);border-radius:4px;padding:1px 6px;width:fit-content;margin-bottom:6px}
  .meta a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}

  .ch-list{margin:6px 0 0;list-style:none;padding:0}
  .ch-list li{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px}
  .ch-list .r{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
    border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0}
  .ch-list .r-good{background:var(--ok-bg);color:var(--ok)}
  .ch-list .r-mid{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
  .ch-list .r-weak{background:var(--warn-bg);color:var(--warn)}
  .ch-list .r-none{background:var(--bad-bg);color:var(--bad)}
  .ch-list .n{flex:1}
  .ch-list a.n{color:var(--text);text-decoration:underline;text-underline-offset:2px}
  .ch-list .n-nolink{color:var(--muted)}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .overlay.hidden{display:none}
  .modal{background:var(--panel);width:100%;max-width:480px;max-height:85vh;overflow-y:auto;
    border-radius:16px 16px 0 0;padding:20px 18px 28px;position:relative}
  @media (min-width:520px){ .overlay{align-items:center} .modal{border-radius:14px;max-height:80vh} }
  .modal .close{position:absolute;top:12px;right:14px;border:none;background:none;font-size:20px;
    color:var(--muted);cursor:pointer;line-height:1;padding:4px}
  .modal .m-name{font-weight:700;font-size:16px;margin:0 28px 4px 0}
  .modal .m-meta{font-size:12px;color:var(--muted);margin-bottom:2px}
  .modal .m-meta a{color:var(--muted)}
  .action-row{display:flex;gap:8px;margin-top:12px}
  .action-btn{flex:1;font-family:inherit;font-size:12.5px;font-weight:600;text-align:center;
    padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);
    color:var(--text);text-decoration:none;cursor:pointer}
  .action-btn:active{opacity:.7}
</style>
</head>
<body>

<header class="top">
  <div class="inner"><h1>営業アプリ <span id="count" class="count"></span></h1></div>
</header>

<div class="wrap">
  <div class="grid" id="grid"><div class="empty">読み込み中…</div></div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const RATING_CLASS = { "◎":"r-good", "○":"r-mid", "△":"r-weak", "✕":"r-none" };
function channelLi(ch){
  const cls = RATING_CLASS[ch.r] || "r-mid";
  const note = ch.m ? ` title="${esc(ch.m)}"` : "";
  const label = ch.u
    ? `<a class="n" href="${esc(ch.u)}" target="_blank" rel="noopener"${note}>${esc(ch.n)}</a>`
    : `<span class="n n-nolink"${note}>${esc(ch.n)}</span>`;
  return `<li><span class="r ${cls}">${esc(ch.r)}</span>${label}</li>`;
}
const CH_ORDER = ["自社サイト", "Instagram", "X", "Facebook", "LINE公式", "YouTube", "note", "TikTok", "Googleマップ", "Yahoo!マップ", "ホットペッパービューティー", "Indeed"];
function sortChannels(channels){
  const rank = n => { const i = CH_ORDER.indexOf(n); return i === -1 ? CH_ORDER.length : i; };
  return channels
    .map((ch, i) => ({ ch, i }))
    .sort((a, b) => rank(a.ch.n) - rank(b.ch.n) || a.i - b.i)
    .map(x => x.ch);
}

const OWN_MEDIA = new Set(["自社サイト", "Instagram", "X", "Facebook", "LINE公式", "YouTube", "note", "TikTok"]);
function channelGroup(label, channels){
  if(!channels.length) return "";
  return `<div class="ch-group"><b>${esc(label)}</b><ul class="ch-list">${channels.map(channelLi).join("")}</ul></div>`;
}

function issueRow(label, text){
  if(!text) return "";
  return `<div class="issue-row"><span class="dept-value">${esc(label)}</span><span>${esc(text)}</span></div>`;
}

function cardHtml(p, idx){
  const c = p.contact || {};
  const channels = Array.isArray(c.channels) ? c.channels : [];
  const own = sortChannels(channels.filter(ch=>OWN_MEDIA.has(ch.n)));
  const other = sortChannels(channels.filter(ch=>!OWN_MEDIA.has(ch.n)));
  const primaryText = p.dept==="営業" ? p.hypothesisSales
    : p.dept==="広報" ? p.hypothesisPr
    : p.hypothesisHr;
  return `<div class="card" data-idx="${idx}">
      <div class="row-head">
        <div class="num">${String(idx+1).padStart(2,"0")}</div>
        <div class="name" title="${esc(p.name||"")}">${esc(p.name||"")}</div>
      </div>
      ${p.area?`<div class="meta" title="${esc(p.area)}">${esc(p.area)}</div>`:""}
      ${primaryText?`<div class="pitch" title="${esc(primaryText)}">${esc(primaryText)}</div>`:""}
    </div>`;
}

function modalBodyHtml(p){
  const c = p.contact || {};
  const channels = Array.isArray(c.channels) ? c.channels : [];
  const own = sortChannels(channels.filter(ch=>OWN_MEDIA.has(ch.n)));
  const other = sortChannels(channels.filter(ch=>!OWN_MEDIA.has(ch.n)));
  return `
    <button class="close" aria-label="閉じる" data-close>×</button>
    <div class="m-name">${esc(p.name||"")}</div>
    ${p.area?`<div class="m-meta">${esc(p.area)}</div>`:""}
    <div class="card-detail">
      <div class="detail-section"><b>課題</b>
        ${issueRow("営業", p.hypothesisSales)}
        ${issueRow("人事", p.hypothesisHr)}
        ${issueRow("広報", p.hypothesisPr)}
      </div>
      ${(c.proposal||c.script||c.message)?`<div class="detail-section"><b>提案</b>
        ${issueRow("骨子", c.proposal)}
        ${issueRow("文面(メール/DM)", c.message)}
        ${issueRow("台本(電話)", c.script)}
      </div>`:""}
      <div class="detail-section"><b>リンク</b>
        ${channelGroup("自社媒体", own)}
        ${channelGroup("他社媒体", other)}
      </div>
      <div class="detail-section"><b>連絡先</b>
        ${issueRow("電話", p.phone || "なし")}
        ${issueRow("メール", p.email || "なし")}
        ${(p.phone||c.script||c.message)?`<div class="action-row">
          ${p.phone?`<a class="action-btn" href="tel:${esc(p.phone.replace(/[^0-9]/g,""))}">電話する</a>`:""}
          ${(c.script||c.message)?`<button class="action-btn" type="button" data-copy="${esc(c.message||c.script||"")}">文面をコピー</button>`:""}
        </div>`:""}
      </div>
    </div>`;
}

let ITEMS = [];
let openIdx = null;
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");
function openModal(idx){
  const p = ITEMS[idx];
  if(!p) return;
  modal.innerHTML = modalBodyHtml(p);
  overlay.classList.remove("hidden");
  openIdx = idx;
}
function closeModal(){ overlay.classList.add("hidden"); openIdx = null; }

document.getElementById("grid").addEventListener("click", e=>{
  if(e.target.closest("a")) return;
  const card = e.target.closest(".card");
  if(!card) return;
  const idx = Number(card.dataset.idx);
  if(idx === openIdx && !overlay.classList.contains("hidden")){ closeModal(); return; }
  openModal(idx);
});
overlay.addEventListener("click", e=>{
  if(e.target === overlay || e.target.closest("[data-close]")) { closeModal(); return; }
  const copyBtn = e.target.closest("[data-copy]");
  if(copyBtn){
    navigator.clipboard?.writeText(copyBtn.dataset.copy).then(()=>{
      const orig = copyBtn.textContent;
      copyBtn.textContent = "コピーしました";
      setTimeout(()=>{ copyBtn.textContent = orig; }, 1500);
    });
  }
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeModal(); });

function rowsToItems(rows){
  if(!rows.length) return [];
  const header = rows[0];
  const idx = {};
  header.forEach((h,i)=> idx[h.trim()] = i);
  return rows.slice(1).filter(r=>r.length>1 || r[0]).map(r=>{
    let channels = [];
    try{ channels = JSON.parse(r[idx.channels_json] || "[]"); }catch(e){}
    return {
      name: r[idx.name],
      category: r[idx.category],
      industry: r[idx.industry],
      area: r[idx.area],
      phone: r[idx.phone],
      email: r[idx.email],
      dept: r[idx.dept],
      hypothesisSales: r[idx.hypothesis_sales],
      hypothesisHr: r[idx.hypothesis_hr],
      hypothesisPr: r[idx.hypothesis_pr],
      contact: {
        channels,
        proposal: r[idx.proposal],
        message: r[idx.message],
        script: r[idx.script],
      },
    };
  }).filter(p=>p.name);
}

async function load(){
  const grid = document.getElementById("grid");
  try{
    const res = await fetch("./data/prospects.json");
    if(!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    const items = rowsToItems(rows);
    if(!items.length) throw new Error("no rows");
    ITEMS = items;
    grid.innerHTML = items.map((p,i)=>cardHtml(p,i)).join("");
    document.getElementById("count").textContent = items.length ? `${items.length}件` : "";
  }catch(err){
    grid.innerHTML = `<div class="empty">データを読み込めませんでした。</div>`;
  }
}
load();
</script>
</body>
</html>
