<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>営業アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Design system: neutral grayscale + single accent, quiet borders, no
     gradients/shadows — modeled after Linear / Vercel / shadcn-ui tone. */
  :root{
    --bg:#fafafa; --panel:#ffffff; --panel-2:#f4f4f5; --border:#e4e4e7;
    --text:#18181b; --muted:#71717a;
    --ok:#15803d; --ok-bg:#f0fdf4; --warn:#a16207; --warn-bg:#fefce8;
    --bad:#b91c1c; --bad-bg:#fef2f2;
    --radius:6px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0a0a0b; --panel:#111113; --panel-2:#19191c; --border:#27272a;
      --text:#f4f4f5; --muted:#8b8b93;
      --ok:#4ade80; --ok-bg:#0f2417; --warn:#facc15; --warn-bg:#2a2308;
      --bad:#f87171; --bad-bg:#2a1414;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  a{color:var(--text)}

  header.top{padding:20px 20px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
  header.top h1{font-size:14px;margin:0;font-weight:600;letter-spacing:-.005em}

  .wrap{padding:28px clamp(16px,4vw,40px) 56px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:1400px;margin:0 auto}
  @media (min-width:1180px){ .grid{grid-template-columns:repeat(5,1fr)} }
  .card{border:1px solid var(--border);border-radius:10px;padding:18px;background:var(--panel);cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 10px rgba(0,0,0,.04)}
  .card:active{background:var(--panel-2)}
  .card .name{font-weight:700;font-size:15px;margin-bottom:4px;letter-spacing:-.01em}
  .card .meta{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .card .pitch{font-size:13px;margin-bottom:12px;line-height:1.6}
  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:13px}
  .hidden{display:none!important}

  .card-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;line-height:1.7}
  .card-detail .txt{white-space:pre-wrap;margin:8px 0 0;color:var(--muted)}
  .card .detail-section{margin-bottom:12px}
  .card .detail-section>b{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .card .dept-value{display:inline-block;font-size:12px;font-weight:700;color:#4338ca;background:#eef2ff;
    border-radius:4px;padding:2px 8px}
  @media (prefers-color-scheme:dark){ .card .dept-value{background:#1e1b4b;color:#a5b4fc} }
  .card .ch-group{margin-top:6px}
  .card .ch-group b{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
  .card .meta a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}

  .card .ch-list{margin:6px 0 0;list-style:none;padding:0}
  .card .ch-list li{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px}
  .card .ch-list .r{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
    border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0}
  .card .ch-list .r-good{background:var(--ok-bg);color:var(--ok)}
  .card .ch-list .r-mid{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
  .card .ch-list .r-weak{background:var(--warn-bg);color:var(--warn)}
  .card .ch-list .r-none{background:var(--bad-bg);color:var(--bad)}
  .card .ch-list .n{flex:1}
  .card .ch-list a.n{color:var(--text);text-decoration:underline;text-underline-offset:2px}
  .card .ch-list .n-nolink{color:var(--muted)}
</style>
</head>
<body>

<header class="top">
  <h1>営業アプリ</h1>
</header>

<div class="wrap">
  <div class="grid" id="grid"><div class="empty">読み込み中…</div></div>
</div>

<script>
const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const RATING_CLASS = { "◎":"r-good", "○":"r-mid", "△":"r-weak", "✕":"r-none" };
function channelLi(ch){
  const cls = RATING_CLASS[ch.r] || "r-mid";
  const note = ch.m ? ` title="${esc(ch.m)}"` : "";
  const label = ch.u
    ? `<a class="n" href="${esc(ch.u)}" target="_blank" rel="noopener"${note}>${esc(ch.n)}</a>`
    : `<span class="n n-nolink"${note}>${esc(ch.n)}</span>`;
  return `<li><span class="r ${cls}">${esc(ch.r)}</span>${label}</li>`;
}
const CH_ORDER = ["自社サイト", "Googleマップ", "Yahoo!マップ", "Instagram", "ホットペッパービューティー", "Indeed"];
function sortChannels(channels){
  const rank = n => { const i = CH_ORDER.indexOf(n); return i === -1 ? CH_ORDER.length : i; };
  return channels
    .map((ch, i) => ({ ch, i }))
    .sort((a, b) => rank(a.ch.n) - rank(b.ch.n) || a.i - b.i)
    .map(x => x.ch);
}

const OWN_MEDIA = new Set(["自社サイト", "Instagram"]);
const DEPT_LABEL = { "営業":"営業", "人事":"人事", "広報":"広報", "その他":"他" };
function channelGroup(label, channels){
  if(!channels.length) return "";
  return `<div class="ch-group"><b>${esc(label)}</b><ul class="ch-list">${channels.map(channelLi).join("")}</ul></div>`;
}

function cardHtml(p){
  const c = p.contact || {};
  const channels = Array.isArray(c.channels) ? c.channels : [];
  const own = sortChannels(channels.filter(ch=>OWN_MEDIA.has(ch.n)));
  const other = sortChannels(channels.filter(ch=>!OWN_MEDIA.has(ch.n)));
  const deptLabel = DEPT_LABEL[p.dept] || p.dept || "";
  return `<div class="card">
      <div class="name">${esc(p.name||"")}</div>
      ${p.area?`<div class="meta">${esc(p.area)}</div>`:""}
      ${p.phone?`<div class="meta"><a href="tel:${esc(p.phone.replace(/[^0-9]/g,""))}">${esc(p.phone)}</a></div>`:""}
      ${p.email?`<div class="meta"><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></div>`:""}
      ${p.hypothesis?`<div class="pitch">${esc(p.hypothesis)}</div>`:""}
      <div class="card-detail hidden" data-card-detail>
        <div class="detail-section"><b>リンク</b>
          ${channelGroup("自", own)}
          ${channelGroup("他", other)}
        </div>
        ${deptLabel?`<div class="detail-section"><b>課題</b><div class="dept-value">${esc(deptLabel)}</div></div>`:""}
        ${c.proposal?`<div class="txt">${esc(c.proposal)}</div>`:""}
        ${c.script?`<div class="txt">${esc(c.script)}</div>`:""}
      </div>
    </div>`;
}

document.getElementById("grid").addEventListener("click", e=>{
  if(e.target.closest("a")) return;
  const card = e.target.closest(".card");
  if(!card) return;
  const detail = card.querySelector("[data-card-detail]");
  if(!detail) return;
  detail.classList.toggle("hidden");
});

function rowsToItems(rows){
  if(!rows.length) return [];
  const header = rows[0];
  const idx = {};
  header.forEach((h,i)=> idx[h.trim()] = i);
  return rows.slice(1).filter(r=>r.length>1 || r[0]).map(r=>{
    let channels = [];
    try{ channels = JSON.parse(r[idx.channels_json] || "[]"); }catch(e){}
    return {
      name: r[idx.name],
      category: r[idx.category],
      industry: r[idx.industry],
      area: r[idx.area],
      phone: r[idx.phone],
      email: r[idx.email],
      dept: r[idx.dept],
      hypothesis: r[idx.hypothesis],
      contact: {
        channels,
        proposal: r[idx.proposal],
        script: r[idx.script],
      },
    };
  }).filter(p=>p.name);
}

async function load(){
  const grid = document.getElementById("grid");
  try{
    const res = await fetch("./data/prospects.json");
    if(!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    const items = rowsToItems(rows);
    if(!items.length) throw new Error("no rows");
    grid.innerHTML = items.map(p=>cardHtml(p)).join("");
  }catch(err){
    grid.innerHTML = `<div class="empty">データを読み込めませんでした。</div>`;
  }
}
load();
</script>
</body>
</html>
