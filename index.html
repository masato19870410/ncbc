<title>わたしのTodoリスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">

<style>
  :root {
    /* 見本スクリーンショットから採色（Tailwind系パレット） */
    --paper: #ffffff;
    --ground: #f7f8fa;
    --ink: #20262f;
    --ink-soft: #5f6b7a;
    --ink-task: #2b323c;
    --ink-faint: #aab1bc;
    --rule: #ececf0;
    --field-border: #d8dce2;
    --placeholder: #9aa2ae;

    --accent: #3b82f6;          /* 「追加」ボタン : blue-500 */
    --accent-hover: #2f74e6;
    --accent-ink: #ffffff;
    --accent-wash: #dbeafe;     /* フォーカスリング : blue-100 */

    --pill-active: #4a6a8a;     /* 「すべて」選択中 : くすんだ青 */
    --pill-active-ink: #ffffff;
    --pill-idle-bg: #eceef2;
    --pill-idle-ink: #5f6b7a;

    --todo-bg: #eceef2;  --todo-fg: #606a77;   /* 未着手 */
    --doing-bg: #fceccb; --doing-fg: #a9791e;  /* 着手中 */
    --done-bg: #dbf1e2;  --done-fg: #3f9560;   /* 完了 */

    --card-border: #e5e7eb;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 10px 34px -14px rgba(15, 23, 42, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1e2530;
      --ground: #141a22;
      --ink: #e8eaed;
      --ink-soft: #9aa4b2;
      --ink-task: #dfe3e8;
      --ink-faint: #6b7480;
      --rule: #2b323d;
      --field-border: #333c48;
      --placeholder: #6b7480;

      --accent: #4a90f0;
      --accent-hover: #5b9bf5;
      --accent-ink: #0f1520;
      --accent-wash: #22304a;

      --pill-active: #5b7ba8;
      --pill-active-ink: #ffffff;
      --pill-idle-bg: #2b323d;
      --pill-idle-ink: #9aa4b2;

      --todo-bg: #2b323d;  --todo-fg: #9aa4b2;
      --doing-bg: #3a3016; --doing-fg: #e0b055;
      --done-bg: #16321f;  --done-fg: #6bc98f;

      --card-border: #2b323d;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 44px -16px rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --paper: #1e2530;
    --ground: #141a22;
    --ink: #e8eaed;
    --ink-soft: #9aa4b2;
    --ink-task: #dfe3e8;
    --ink-faint: #6b7480;
    --rule: #2b323d;
    --field-border: #333c48;
    --placeholder: #6b7480;

    --accent: #4a90f0;
    --accent-hover: #5b9bf5;
    --accent-ink: #0f1520;
    --accent-wash: #22304a;

    --pill-active: #5b7ba8;
    --pill-active-ink: #ffffff;
    --pill-idle-bg: #2b323d;
    --pill-idle-ink: #9aa4b2;

    --todo-bg: #2b323d;  --todo-fg: #9aa4b2;
    --doing-bg: #3a3016; --doing-fg: #e0b055;
    --done-bg: #16321f;  --done-fg: #6bc98f;

    --card-border: #2b323d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 44px -16px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    display: flex;
    justify-content: center;
    padding: clamp(20px, 6vw, 64px) 16px 56px;
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: clamp(22px, 5vw, 38px) clamp(18px, 5vw, 36px);
  }

  header { text-align: center; }

  h1 {
    font-weight: 700;
    font-size: clamp(25px, 6vw, 29px);
    line-height: 1.4;
    margin: 0 0 8px;
    text-wrap: balance;
  }

  .lede {
    margin: 0;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink-soft);
  }

  form {
    display: flex;
    gap: 8px;
    align-items: stretch;
    margin-top: 24px;
  }

  #field {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 15px;
    line-height: 1.5;
    padding: 12px 14px;
    border: 1px solid var(--field-border);
    border-radius: 7px;
    background: var(--paper);
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #field::placeholder { color: var(--placeholder); }
  #field:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-wash);
  }

  .btn-add {
    font: inherit;
    font-weight: 600;
    font-size: 14.5px;
    padding: 12px 22px;
    white-space: nowrap;
    border: none;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-add:hover { background: var(--accent-hover); }
  .btn-add:active { transform: translateY(1px); }
  .btn-add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 18px;
    padding: 14px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  .filter {
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    padding: 7px 15px;
    border: none;
    border-radius: 6px;
    background: var(--pill-idle-bg);
    color: var(--pill-idle-ink);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .filter:hover { filter: brightness(0.97); }
  .filter[aria-pressed="true"] {
    background: var(--pill-active);
    color: var(--pill-active-ink);
    font-weight: 600;
  }
  .filter:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  ul { list-style: none; margin: 0; padding: 0; }

  li {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--rule);
    animation: slide-in 0.2s ease;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: none; }
  }

  .status {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    padding: 5px 11px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    min-width: 60px;
    text-align: center;
    transition: transform 0.12s;
  }
  .status:active { transform: scale(0.94); }
  .status:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status.todo  { background: var(--todo-bg);  color: var(--todo-fg); }
  .status.doing { background: var(--doing-bg); color: var(--doing-fg); }
  .status.done  { background: var(--done-bg);  color: var(--done-fg); }

  .task {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-task);
    word-break: break-word;
  }
  li.is-done .task {
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
  }

  .remove {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-faint);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .remove:hover { background: var(--pill-idle-bg); color: var(--ink); }
  .remove:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .empty {
    text-align: center;
    color: var(--ink-faint);
    font-size: 14px;
    padding: 34px 0 26px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div class="sheet">
  <header>
    <h1>わたしのTodoリスト</h1>
    <p class="lede">追加 → 状態を切り替え（未着手 / 着手中 / 完了）→ 削除ができます</p>
  </header>

  <form id="add-form" autocomplete="off">
    <input id="field" type="text" placeholder="やることを入力（例: 資料をまとめる）" aria-label="やること" maxlength="140">
    <button class="btn-add" type="submit">追加</button>
  </form>

  <div class="filters" role="group" aria-label="表示の絞り込み">
    <button class="filter" data-filter="all" aria-pressed="true">すべて</button>
    <button class="filter" data-filter="todo" aria-pressed="false">未着手</button>
    <button class="filter" data-filter="doing" aria-pressed="false">着手中</button>
    <button class="filter" data-filter="done" aria-pressed="false">完了</button>
  </div>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>まだやることがありません</p>
</div>

<script>
  (function () {
    "use strict";

    var KEY = "watashi-no-todo:v1";
    var STATES = ["todo", "doing", "done"];
    var LABELS = { todo: "未着手", doing: "着手中", done: "完了" };

    var list = document.getElementById("list");
    var empty = document.getElementById("empty");
    var form = document.getElementById("add-form");
    var field = document.getElementById("field");
    var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter"));

    var items = load();
    var filter = "all";

    function load() {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return [];
        var data = JSON.parse(raw);
        if (!Array.isArray(data)) return [];
        return data.filter(function (it) {
          return it && typeof it.text === "string" && STATES.indexOf(it.status) > -1;
        });
      } catch (e) {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(items));
      } catch (e) { /* storage unavailable — keep working in memory */ }
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function add(text) {
      items.unshift({ id: uid(), text: text, status: "todo" });
      save();
      render();
    }

    function cycle(id) {
      items.forEach(function (it) {
        if (it.id === id) {
          it.status = STATES[(STATES.indexOf(it.status) + 1) % STATES.length];
        }
      });
      save();
      render();
    }

    function remove(id) {
      items = items.filter(function (it) { return it.id !== id; });
      save();
      render();
    }

    function render() {
      filterBtns.forEach(function (btn) {
        btn.setAttribute("aria-pressed", String(btn.getAttribute("data-filter") === filter));
      });

      var shown = items.filter(function (it) {
        return filter === "all" || it.status === filter;
      });

      list.innerHTML = "";
      shown.forEach(function (it) {
        var li = document.createElement("li");
        if (it.status === "done") li.className = "is-done";

        var status = document.createElement("button");
        status.type = "button";
        status.className = "status " + it.status;
        status.textContent = LABELS[it.status];
        status.setAttribute("aria-label", "状態: " + LABELS[it.status] + "（押すと切り替え）");
        status.addEventListener("click", function () { cycle(it.id); });

        var task = document.createElement("span");
        task.className = "task";
        task.textContent = it.text;

        var del = document.createElement("button");
        del.type = "button";
        del.className = "remove";
        del.innerHTML = "&times;";
        del.setAttribute("aria-label", "「" + it.text + "」を削除");
        del.addEventListener("click", function () { remove(it.id); });

        li.appendChild(status);
        li.appendChild(task);
        li.appendChild(del);
        list.appendChild(li);
      });

      var nothing = shown.length === 0;
      empty.hidden = !nothing;
      empty.textContent = (nothing && items.length > 0)
        ? "この分類のやることはありません"
        : "まだやることがありません";
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var text = field.value.trim();
      if (!text) return;
      add(text);
      field.value = "";
      field.focus();
    });

    filterBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        filter = btn.getAttribute("data-filter");
        render();
      });
    });

    if (items.length === 0) {
      items = [
        { id: uid(), text: "AIに指示を書いてみる", status: "todo" },
        { id: uid(), text: "作りたいものを選ぶ", status: "doing" },
        { id: uid(), text: "完成見本を触ってみる", status: "done" }
      ];
      save();
    }

    render();
  })();
</script>
