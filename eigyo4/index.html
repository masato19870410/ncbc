<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>営業アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Design system: neutral grayscale + single accent, quiet borders, no
     gradients/shadows — modeled after Linear / Vercel / shadcn-ui tone. */
  :root{
    --bg:#fafafa; --panel:#ffffff; --panel-2:#f4f4f5; --border:#e4e4e7;
    --text:#18181b; --muted:#71717a;
    --ok:#15803d; --ok-bg:#f0fdf4; --warn:#a16207; --warn-bg:#fefce8;
    --bad:#b91c1c; --bad-bg:#fef2f2;
    --radius:6px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0a0a0b; --panel:#111113; --panel-2:#19191c; --border:#27272a;
      --text:#f4f4f5; --muted:#8b8b93;
      --ok:#4ade80; --ok-bg:#0f2417; --warn:#facc15; --warn-bg:#2a2308;
      --bad:#f87171; --bad-bg:#2a1414;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  a{color:var(--text)}

  header.top{border-bottom:1px solid var(--border);background:var(--panel)}
  header.top .inner{max-width:480px;margin:0 auto;padding:16px 16px 12px}
  header.top h1{font-size:14px;margin:0;font-weight:600;letter-spacing:-.005em}
  header.top .count{font-size:11.5px;font-weight:500;color:var(--muted)}
  header.top .src{margin-top:2px;font-size:10.5px;color:var(--muted)}

  .wrap{padding:16px 16px 48px;max-width:480px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:start}
  .card{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--panel);cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 10px rgba(0,0,0,.04);min-width:0}
  .card:active{background:var(--panel-2)}
  .card .row-head{display:flex;align-items:baseline;gap:6px;min-width:0;margin-bottom:4px}
  .card .num{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);flex-shrink:0}
  .card .name{font-weight:700;font-size:13.5px;letter-spacing:-.01em;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta{font-size:11px;color:var(--muted);line-height:1.6;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .pitch{font-size:12px;margin-top:8px;margin-bottom:10px;line-height:1.55;min-height:55.8px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .card-cost{font-size:12px;margin-top:8px;margin-bottom:10px;line-height:1.5;min-height:55.8px}
  .card .cost-tag{display:block;font-size:10px;font-weight:700;color:var(--ok);background:var(--ok-bg);
    border-radius:4px;padding:1px 6px;width:fit-content;margin-bottom:4px}
  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:13px;grid-column:1/-1}
  .hidden{display:none!important}

  .card-detail{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;line-height:1.7}
  .card-detail .txt{white-space:pre-wrap;margin:8px 0 0;color:var(--muted)}
  .detail-section{margin-bottom:20px}
  .detail-section:last-child{margin-bottom:0}
  .detail-section>b{display:block;font-size:11px;color:var(--muted);font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
  .issue-row{margin-top:10px}
  .issue-row:first-child{margin-top:0}
  .dept-value{display:block;font-size:10.5px;font-weight:700;color:var(--text);
    background:var(--panel-2);border-radius:4px;padding:1px 6px;width:fit-content;margin-bottom:4px}
  .issue-row>span:last-child{display:block;font-size:12.5px;color:var(--text);line-height:1.6}
  .ch-group{margin-top:10px}
  .ch-group:first-child{margin-top:0}
  .ch-group b{display:block;font-size:10.5px;font-weight:700;color:var(--text);
    background:var(--panel-2);border-radius:4px;padding:1px 6px;width:fit-content;margin-bottom:6px}
  .meta a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}

  .ch-list{margin:6px 0 0;list-style:none;padding:0}
  .ch-list li{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px}
  .ch-list .r{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
    border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0}
  .ch-list .r-good{background:var(--ok-bg);color:var(--ok)}
  .ch-list .r-mid{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
  .ch-list .r-weak{background:var(--warn-bg);color:var(--warn)}
  .ch-list .r-none{background:var(--bad-bg);color:var(--bad)}
  .ch-list .n{flex:1}
  .ch-list a.n{color:var(--text);text-decoration:underline;text-underline-offset:2px}
  .ch-list .n-nolink{color:var(--muted)}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .overlay.hidden{display:none}
  .modal{background:var(--panel);width:100%;max-width:480px;max-height:85vh;overflow-y:auto;
    border-radius:16px 16px 0 0;padding:20px 18px 28px;position:relative}
  @media (min-width:520px){ .overlay{align-items:center} .modal{border-radius:14px;max-height:80vh} }
  .modal .close{position:absolute;top:12px;right:14px;border:none;background:none;font-size:20px;
    color:var(--muted);cursor:pointer;line-height:1;padding:4px}
  .modal .m-name{font-weight:700;font-size:16px;margin:0 28px 4px 0}
  .modal .m-meta{font-size:12px;color:var(--muted);margin-bottom:2px}
  .modal .m-meta a{color:var(--muted)}
  .action-row{display:flex;gap:8px;margin-top:12px}
  .action-btn{flex:1;font-family:inherit;font-size:12.5px;font-weight:600;text-align:center;
    padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);
    color:var(--text);text-decoration:none;cursor:pointer}
  .action-btn:active{opacity:.7}

  .approach-note{background:var(--panel-2);border-radius:8px;padding:10px 12px;font-size:12.5px;
    color:var(--text);line-height:1.6;margin-top:4px}

  .diag-box{background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:10px 12px}
  .diag-type{font-weight:700;font-size:13.5px;color:var(--ok);margin-bottom:4px}
  .diag-desc{font-size:12px;color:var(--text);line-height:1.6}
  .diag-method{margin-top:8px;font-size:12px;color:var(--text);line-height:1.6}
  .diag-method .dept-value{margin-right:6px;margin-bottom:0;display:inline-block}
  .diag-fit{color:var(--ok)}
  .diag-fit-empty{margin-top:8px;font-size:11px;color:var(--muted)}

  .sender-bar{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sender-bar .label{font-size:11px;color:var(--muted)}
  .sender-btn{font-family:inherit;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;
    border:1px solid var(--border);background:var(--panel-2);color:var(--muted);cursor:pointer}
  .sender-btn.active{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}

  .reco-toggle{margin-top:10px;font-family:inherit;font-size:12px;font-weight:600;padding:7px 14px;
    border-radius:20px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer}
  .reco-toggle.active{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .reco-badge{display:inline-block;font-size:10px;font-weight:700;color:var(--ok);background:var(--ok-bg);
    border-radius:4px;padding:1px 6px;margin-bottom:4px}

  .conclusion-box{background:var(--panel-2);border:2px solid var(--text);border-radius:10px;
    padding:14px 16px;margin-bottom:16px}
  .conclusion-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .conclusion-cost{font-size:18px;font-weight:700;margin:4px 0 6px;color:var(--ok)}
  .conclusion-dept{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
  .conclusion-reason{font-size:12.5px;color:var(--text);line-height:1.6}

  .diag-details{margin-bottom:20px}
  .diag-details summary{cursor:pointer;font-size:11px;color:var(--muted);font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
  .diag-details .diag-box{margin-top:8px}
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <h1>営業アプリ <span id="count" class="count"></span></h1>
    <div class="src">データ: Googleスプレッドシート直読み(v4)</div>
    <button class="reco-toggle" id="recoToggle" type="button">🔥 あなたにおすすめの営業先</button>
  </div>
</header>

<div class="wrap">
  <div class="grid" id="grid"><div class="empty">読み込み中…</div></div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
/* =======================================================================
   v4: データ取得元を Googleスプレッドシートの「ウェブに公開」CSVに変更。
   UI/CSS/チェックリスト表示ロジックは eigyo3.5 ベース + アプローチの切り口を追加。

   ★ユーザー作業が必要★
   下の SHEET_CSV_URL に、Googleスプレッドシート側で
   「ファイル→共有→ウェブに公開」した後に発行されるCSVエクスポートURLを
   設定すること。手順は README.md を参照。
   ======================================================================= */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1OmKyrwSlLxOEPetl5Q17Aox05Ata8FHMxhDEYgtDkX4/export?format=csv&gid=1331008365";

const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const RATING_CLASS = { "◎":"r-good", "○":"r-mid", "△":"r-weak", "✕":"r-none" };
function channelLi(ch){
  const cls = RATING_CLASS[ch.r] || "r-mid";
  const note = ch.m ? ` title="${esc(ch.m)}"` : "";
  const label = ch.u
    ? `<a class="n" href="${esc(ch.u)}" target="_blank" rel="noopener"${note}>${esc(ch.n)}</a>`
    : `<span class="n n-nolink"${note}>${esc(ch.n)}</span>`;
  return `<li><span class="r ${cls}">${esc(ch.r)}</span>${label}</li>`;
}
const CH_ORDER = ["自社サイト", "Instagram", "X", "Facebook", "LINE公式", "YouTube", "note", "TikTok", "Googleマップ", "Yahoo!マップ", "ホットペッパービューティー", "Indeed"];
function sortChannels(channels){
  const rank = n => { const i = CH_ORDER.indexOf(n); return i === -1 ? CH_ORDER.length : i; };
  return channels
    .map((ch, i) => ({ ch, i }))
    .sort((a, b) => rank(a.ch.n) - rank(b.ch.n) || a.i - b.i)
    .map(x => x.ch);
}

const OWN_MEDIA = new Set(["自社サイト", "Instagram", "X", "Facebook", "LINE公式", "YouTube", "note", "TikTok"]);
function channelGroup(label, channels){
  if(!channels.length) return "";
  return `<div class="ch-group"><b>${esc(label)}</b><ul class="ch-list">${channels.map(channelLi).join("")}</ul></div>`;
}

function issueRow(label, text){
  if(!text) return "";
  return `<div class="issue-row"><span class="dept-value">${esc(label)}</span><span>${esc(text)}</span></div>`;
}

function findChannel(channels, name){ return channels.find(ch=>ch.n===name); }

/* ---- 送り手(自分)のプロフィール: localStorageに保存、使うほど診断に反映される ---- */
const SENDER_KEY = "eigyo_sender_style";
const SENDER_STYLES = {
  phone: { label: "電話・対話が得意", icon: "☎" },
  writing: { label: "文章・丁寧さが得意", icon: "✎" },
  network: { label: "人脈・紹介が得意", icon: "🤝" },
};
function getSenderStyle(){
  try{ return localStorage.getItem(SENDER_KEY) || ""; }catch(e){ return ""; }
}
function setSenderStyle(v){
  try{ localStorage.setItem(SENDER_KEY, v); }catch(e){}
}

const TRAIT_KEY = "eigyo_sender_trait";
const SENDER_TRAITS = {
  steady: { label: "丁寧・堅実型", icon: "🪪" },
  energetic: { label: "フレンドリー・バイタリティ型", icon: "⚡" },
};
function getSenderTrait(){
  try{ return localStorage.getItem(TRAIT_KEY) || ""; }catch(e){ return ""; }
}
function setSenderTrait(v){
  try{ localStorage.setItem(TRAIT_KEY, v); }catch(e){}
}

function diagnoseApproach(p){
  const c = p.contact || {};
  const channels = Array.isArray(c.channels) ? c.channels : [];
  const site = findChannel(channels, "自社サイト");
  const gmap = findChannel(channels, "Googleマップ");
  const indeed = findChannel(channels, "Indeed");
  const known = channels.filter(ch => ch.r==="◎" || ch.r==="○").length;

  let type, typeDesc;
  if((!site || site.r==="✕") && (!gmap || gmap.r==="✕")){
    type = "認知構築型";
    typeDesc = "自社サイト・Googleマップともに情報が無く、検索しても見つからない状態。まず「存在を知ってもらう」提案が合う。";
  } else if(site && site.r==="△"){
    type = "改善提案型";
    typeDesc = "自社サイトは既にあるが情報が不足/弱い状態。ゼロから作るより「今あるものの改善」として軽く提案しやすい。";
  } else if(indeed && (indeed.r==="◎"||indeed.r==="○") && (!site || site.r==="✕")){
    type = "応募導線型";
    typeDesc = "Indeedで求人募集中だが自社サイトが無く、応募前の不安を解消できていない。採用特化の受け皿づくりが刺さりやすい。";
  } else {
    type = "信頼補強型";
    typeDesc = "情報はあるが証拠(口コミ・実績)が少ない状態。信頼材料を補強する提案が合う。";
  }

  let method = known <= 2
    ? "電話(ただし求人内容や会社概要を事前に読み込み、いきなり感を減らしてから)"
    : "電話(会話の冒頭で把握済みの具体的事実に触れると自然)";

  let fit = "";
  const style = getSenderStyle();
  const hasEmail = !!p.email;
  if(style === "phone"){
    fit = "あなたの「電話・対話が得意」なスタイルと相性良好。台本をベースに、その場での会話で押し切れる。";
  } else if(style === "writing"){
    if(hasEmail){
      method = "まずメールで要点を丁寧に伝え、反応を見てから電話";
      fit = "あなたの「文章が得意」なスタイルを活かすなら、電話より先にメールで丁寧に伝える方が強みが出る。";
    } else {
      fit = "この会社はメール窓口が無く電話一択だが、文章が得意なら台本を事前にしっかり作り込んでから電話すると強みを活かせる。";
    }
  } else if(style === "network"){
    fit = "いきなりの電話より、地元の商工会・業界団体・知人経由で接点を作れないか先に探る方が「人脈・紹介」の強みに合う。";
  }

  const trait = getSenderTrait();
  let traitNote = "";
  if(trait === "steady"){
    traitNote = "丁寧・堅実型なら、具体的な数字(求人件数・評価点など)を淡々と積み上げて話す方が信頼されやすい。";
  } else if(trait === "energetic"){
    traitNote = "フレンドリー・バイタリティ型なら、明るいトーンで率直に切り出しても警戒されにくい相手(地域密着の小規模事業者)。";
  }
  if(traitNote) fit = fit ? `${fit} ${traitNote}` : traitNote;

  return { type, typeDesc, method, fit };
}

/* ---- 営業/人事/広報のうちどれが最も費用対効果が高いかを結論づける ---- */
function concludeDept(p){
  const c = p.contact || {};
  const channels = Array.isArray(c.channels) ? c.channels : [];
  const site = findChannel(channels, "自社サイト");
  const gmap = findChannel(channels, "Googleマップ");
  const indeed = findChannel(channels, "Indeed");

  if(!gmap || gmap.r === "✕"){
    return {
      cost: "無料・即日",
      action: "Googleビジネスプロフィールの登録",
      dept: "営業",
      text: p.hypothesisSales,
      reason: "無料・即日反映で最も低コスト。営業課題への着手が最もROIが高い。",
    };
  }
  if((!site || site.r==="✕") && indeed && (indeed.r==="◎"||indeed.r==="○")){
    return {
      cost: "低コスト",
      action: "採用特化ページの新設",
      dept: "人事",
      text: p.hypothesisHr,
      reason: "求人が実際に動いている(Indeed掲載中)タイミングで受け皿を作るだけで応募の離脱を防げる。人事課題への着手が最もROIが高い。",
    };
  }
  if(site && site.r==="△"){
    return {
      cost: "低コスト",
      action: "既存サイトの改善(SSL化・採用ページ追加など)",
      dept: "営業",
      text: p.hypothesisSales,
      reason: "ゼロから作るより圧倒的に低コスト。営業課題への着手が最もROIが高い。",
    };
  }
  return {
    cost: "中コスト・時間要",
    action: "SNS等での情報発信の開始",
    dept: "広報",
    text: p.hypothesisPr,
    reason: "営業・人事側の低コストな打ち手が既に無いため、相対的に最もROIが高い(効果が出るまでやや時間はかかる)。",
  };
}

function fitScore(p){
  // 費用対効果ファースト: 「低コストで直せる」「相手に予算感がある」を優先し、
  // 情報の濃さ(裏取り件数)は次点の加点にする。
  const c = p.contact || {};
  const channels = Array.isArray(c.channels) ? c.channels : [];
  const known = channels.filter(ch => ch.r==="◎" || ch.r==="○").length;
  const diag = diagnoseApproach(p);
  const indeed = findChannel(channels, "Indeed");

  let score = 0;
  // 低コストで直せる(改善提案・応募導線)ほどROIが高い。ゼロから作る(認知構築)は工数が重い。
  if(diag.type === "改善提案型") score += 30;
  else if(diag.type === "応募導線型") score += 25;
  else if(diag.type === "信頼補強型") score += 15;
  else score += 5; // 認知構築型

  // 相手の採用予算感(求人の活発さ)をROIの代理指標にする
  if(indeed){
    if(indeed.r === "◎") score += 20;
    else if(indeed.r === "○") score += 10;
  }

  // 情報の濃さは次点(薄い会社は自動的に下位へ)
  score += known * 5;

  const style = getSenderStyle();
  if(style === "network" && (!indeed || indeed.r==="✕")) score += 10;
  if(style === "phone" && known >= 2) score += 5;
  const trait = getSenderTrait();
  if(trait === "energetic") score += 3;

  return score;
}

function cardHtml(p, idx, recoRank){
  const c = p.contact || {};
  const channels = Array.isArray(c.channels) ? c.channels : [];
  const concl = concludeDept(p);
  const badge = (recoRank !== undefined && recoRank !== null && recoRank < 3)
    ? `<span class="reco-badge">🔥 おすすめ</span>` : "";
  return `<div class="card" data-idx="${idx}">
      <div class="row-head">
        <div class="num">${String(idx+1).padStart(2,"0")}</div>
        <div class="name" title="${esc(p.name||"")}">${esc(p.name||"")}</div>
      </div>
      ${badge}
      ${p.area?`<div class="meta" title="${esc(p.area)}">${esc(p.area)}</div>`:""}
      <div class="card-cost"><span class="cost-tag">${esc(concl.cost)}</span>${esc(concl.action)}</div>
    </div>`;
}

function modalBodyHtml(p){
  const c = p.contact || {};
  const channels = Array.isArray(c.channels) ? c.channels : [];
  const own = sortChannels(channels.filter(ch=>OWN_MEDIA.has(ch.n)));
  const other = sortChannels(channels.filter(ch=>!OWN_MEDIA.has(ch.n)));
  const diag = diagnoseApproach(p);
  const conclusion = concludeDept(p);
  return `
    <button class="close" aria-label="閉じる" data-close>×</button>
    <div class="m-name">${esc(p.name||"")}</div>
    ${p.area?`<div class="m-meta">${esc(p.area)}</div>`:""}
    <div class="card-detail">
      <div class="conclusion-box">
        <div class="conclusion-label">費用対効果</div>
        <div class="conclusion-cost">${esc(conclusion.cost)} — ${esc(conclusion.action)}</div>
        <div class="conclusion-dept">最もROIが高いのは${esc(conclusion.dept)}課題</div>
        <div class="conclusion-reason">${esc(conclusion.reason)}</div>
      </div>
      <details class="diag-details">
        <summary>診断の詳細を見る</summary>
        <div class="diag-box">
          <div class="diag-type">${esc(diag.type)}</div>
          <div class="diag-desc">${esc(diag.typeDesc)}</div>
          ${c.approachNote?`<div class="diag-method"><span class="dept-value">アプローチの切り口(費用対効果)</span>${esc(c.approachNote)}</div>`:""}
          <div class="diag-method"><span class="dept-value">推奨アプローチ</span>${esc(diag.method)}</div>
          ${diag.fit?`<div class="diag-method diag-fit"><span class="dept-value">あなたとの相性</span>${esc(diag.fit)}</div>`:""}
          ${!getSenderStyle()?`<div class="sender-bar" data-sender-bar="style"><span class="label">得意なスタイル(任意):</span></div>`:""}
          ${!getSenderTrait()?`<div class="sender-bar" data-sender-bar="trait"><span class="label">性格タイプ(任意):</span></div>`:""}
        </div>
      </details>
      <div class="detail-section"><b>課題</b>
        ${issueRow("営業", p.hypothesisSales)}
        ${issueRow("人事", p.hypothesisHr)}
        ${issueRow("広報", p.hypothesisPr)}
      </div>
      ${(c.proposal||c.script||c.message)?`<div class="detail-section"><b>提案</b>
        ${issueRow("骨子", c.proposal)}
        ${issueRow("文面(メール/DM)", c.message)}
        ${issueRow("台本(電話)", c.script)}
      </div>`:""}
      <div class="detail-section"><b>リンク</b>
        ${channelGroup("自社媒体", own)}
        ${channelGroup("他社媒体", other)}
      </div>
      <div class="detail-section"><b>連絡先</b>
        ${issueRow("電話", p.phone || "なし")}
        ${issueRow("メール", p.email || "なし")}
        ${(p.phone||c.script||c.message)?`<div class="action-row">
          ${p.phone?`<a class="action-btn" href="tel:${esc(p.phone.replace(/[^0-9]/g,""))}">電話する</a>`:""}
          ${(c.script||c.message)?`<button class="action-btn" type="button" data-copy="${esc(c.message||c.script||"")}">文面をコピー</button>`:""}
        </div>`:""}
      </div>
    </div>`;
}

function renderSenderBar(){
  const styleBar = document.querySelector('[data-sender-bar="style"]');
  if(styleBar){
    Object.entries(SENDER_STYLES).forEach(([key, s])=>{
      const btn = document.createElement("button");
      btn.className = "sender-btn";
      btn.type = "button";
      btn.dataset.style = key;
      btn.textContent = `${s.icon} ${s.label}`;
      styleBar.appendChild(btn);
    });
  }
  const traitBar = document.querySelector('[data-sender-bar="trait"]');
  if(traitBar){
    Object.entries(SENDER_TRAITS).forEach(([key, s])=>{
      const btn = document.createElement("button");
      btn.className = "sender-btn";
      btn.type = "button";
      btn.dataset.trait = key;
      btn.textContent = `${s.icon} ${s.label}`;
      traitBar.appendChild(btn);
    });
  }
}

let ITEMS = [];
let openIdx = null;
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");
function openModal(idx){
  const p = ITEMS[idx];
  if(!p) return;
  modal.innerHTML = modalBodyHtml(p);
  overlay.classList.remove("hidden");
  openIdx = idx;
  renderSenderBar();
}
function closeModal(){ overlay.classList.add("hidden"); openIdx = null; }

document.getElementById("grid").addEventListener("click", e=>{
  if(e.target.closest("a")) return;
  const card = e.target.closest(".card");
  if(!card) return;
  const idx = Number(card.dataset.idx);
  if(idx === openIdx && !overlay.classList.contains("hidden")){ closeModal(); return; }
  openModal(idx);
});
overlay.addEventListener("click", e=>{
  if(e.target === overlay || e.target.closest("[data-close]")) { closeModal(); return; }
  const copyBtn = e.target.closest("[data-copy]");
  if(copyBtn){
    navigator.clipboard?.writeText(copyBtn.dataset.copy).then(()=>{
      const orig = copyBtn.textContent;
      copyBtn.textContent = "コピーしました";
      setTimeout(()=>{ copyBtn.textContent = orig; }, 1500);
    });
    return;
  }
  const styleBtn = e.target.closest(".sender-btn[data-style]");
  if(styleBtn){
    setSenderStyle(getSenderStyle() === styleBtn.dataset.style ? "" : styleBtn.dataset.style);
    if(openIdx !== null) openModal(openIdx);
    return;
  }
  const traitBtn = e.target.closest(".sender-btn[data-trait]");
  if(traitBtn){
    setSenderTrait(getSenderTrait() === traitBtn.dataset.trait ? "" : traitBtn.dataset.trait);
    if(openIdx !== null) openModal(openIdx);
  }
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeModal(); });

/* ---- CSVパース（RFC4180相当。カンマ/改行/二重引用符を含むフィールドに対応） ---- */
function parseCsv(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += ch;
      }
    } else {
      if(ch === '"'){
        inQuotes = true;
      } else if(ch === ','){
        row.push(field); field = "";
      } else if(ch === '\n'){
        row.push(field); field = "";
        rows.push(row); row = [];
      } else if(ch === '\r'){
        // skip, \n (or end) will close the row
      } else {
        field += ch;
      }
    }
  }
  // 末尾に改行が無いファイルの最終フィールド/行を回収
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ""));
}

function rowsToItems(rows){
  if(!rows.length) return [];
  const header = rows[0];
  const idx = {};
  header.forEach((h,i)=> idx[h.trim()] = i);
  return rows.slice(1).filter(r=>r.length>1 || r[0]).map(r=>{
    let channels = [];
    try{ channels = JSON.parse(r[idx.channels_json] || "[]"); }catch(e){}
    return {
      name: r[idx.name],
      category: r[idx.category],
      industry: r[idx.industry],
      area: r[idx.area],
      phone: r[idx.phone],
      email: r[idx.email],
      dept: r[idx.dept],
      hypothesisSales: r[idx.hypothesis_sales],
      hypothesisHr: r[idx.hypothesis_hr],
      hypothesisPr: r[idx.hypothesis_pr],
      contact: {
        channels,
        proposal: r[idx.proposal],
        approachNote: r[idx.approach_note],
        message: r[idx.message],
        script: r[idx.script],
      },
    };
  }).filter(p=>p.name);
}

let RECO_MODE = true;
function renderGrid(){
  const grid = document.getElementById("grid");
  if(!ITEMS.length) return;
  let order = ITEMS.map((p,i)=>({p,i}));
  if(RECO_MODE) order = order.slice().sort((a,b)=>fitScore(b.p)-fitScore(a.p));
  grid.innerHTML = order.map(({p,i},rank)=>cardHtml(p,i,RECO_MODE?rank:null)).join("");
}
document.getElementById("recoToggle").classList.add("active");
document.getElementById("recoToggle").textContent = "✕ 通常順に戻す";
document.getElementById("recoToggle").addEventListener("click", ()=>{
  RECO_MODE = !RECO_MODE;
  document.getElementById("recoToggle").classList.toggle("active", RECO_MODE);
  document.getElementById("recoToggle").textContent = RECO_MODE ? "✕ 通常順に戻す" : "🔥 あなたにおすすめの営業先";
  renderGrid();
});

async function load(){
  const grid = document.getElementById("grid");
  try{
    if(!SHEET_CSV_URL || SHEET_CSV_URL.indexOf("__SET_SHEET_CSV_URL_HERE__") !== -1){
      throw new Error("SHEET_CSV_URL未設定");
    }
    const res = await fetch(SHEET_CSV_URL);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = parseCsv(text);
    const items = rowsToItems(rows);
    if(!items.length) throw new Error("no rows");
    ITEMS = items;
    renderGrid();
    document.getElementById("count").textContent = items.length ? `${items.length}件` : "";
  }catch(err){
    console.error(err);
    grid.innerHTML = `<div class="empty">データを読み込めませんでした。(${esc(err.message)})<br>SHEET_CSV_URLの設定、またはシートの「ウェブに公開」設定を確認してください。README.mdを参照。</div>`;
  }
}
load();
